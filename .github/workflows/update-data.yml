name: Update Curaçao football data

on:
  schedule:
    # 06:15 and 18:15 UTC = 02:15 and 14:15 in Curaçao (UTC-4)
    - cron: '15 6,18 * * *'
    # and shortly after Saturday and Sunday evening kickoffs
    - cron: '30 2 * * 0,1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: tools
        run: npm install --no-audit --no-fund

      - name: Read the FFK feed and rebuild data.json
        working-directory: tools
        run: node run.js

      - name: Commit if anything changed
        run: |
          git config user.name  "korsou-futbol-bot"
          git config user.email "bot@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "No change."
            exit 0
          fi
          git add data.json
          git commit -m "data: refresh from ffk.cw ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
          git push

      - name: Keep the raw scrape as an artifact for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-scrape
          path: tools/raw.json
          retention-days: 7
          if-no-files-found: ignore
