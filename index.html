<!doctype html>
<html lang="pa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08131F" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F1E9" media="(prefers-color-scheme: light)">
<meta name="description" content="Scores, tables, scorers and transfers for all Curacao football competitions.">
<meta name="mobile-web-app-capable" content="content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="599 Scores">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
html,body{min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#F4F1E9;color:#141D2C;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>599 Scores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..600&display=swap">
<style>
/* ============ tokens ============ */
:root{
  --ground:#F4F1E9;
  --surface:#FFFFFF;
  --surface-2:#EBE7DD;
  --surface-3:#E1DCD0;
  --line:#D9D3C6;
  --line-soft:#E7E2D7;
  --ink:#141D2C;
  --ink-2:#55606F;
  --ink-3:#8B9099;
  --accent:#1B4FD8;
  --accent-ink:#FFFFFF;
  --accent-soft:#E2E9FB;
  --gold:#E8B60A;
  --gold-soft:#FBF0CC;
  --win:#0F8556;
  --draw:#9AA0A8;
  --loss:#C23A2F;
  --live:#DD2E22;
  --bronze:#A2683A; --silver:#6F7C8A; --goldm:#B0820B; --elite:#1B4FD8;
  --shadow:0 1px 2px rgba(20,29,44,.06), 0 6px 20px -12px rgba(20,29,44,.28);
  --radius:14px;
  --radius-s:9px;
  --maxw:1140px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#08131F;
    --surface:#0E1E2F;
    --surface-2:#152B41;
    --surface-3:#1D3A55;
    --line:#223B54;
    --line-soft:#182D42;
    --ink:#E8EFF7;
    --ink-2:#9AAABD;
    --ink-3:#69798D;
    --accent:#5B8CFF;
    --accent-ink:#06101C;
    --accent-soft:#14294A;
    --gold:#FFD02E;
    --gold-soft:#332A08;
    --win:#2FC186;
    --draw:#69798D;
    --loss:#FF6A5C;
    --live:#FF4A3C;
    --bronze:#D9965C; --silver:#AEBBC9; --goldm:#FFD02E; --elite:#5B8CFF;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#08131F; --surface:#0E1E2F; --surface-2:#152B41; --surface-3:#1D3A55;
  --line:#223B54; --line-soft:#182D42; --ink:#E8EFF7; --ink-2:#9AAABD; --ink-3:#69798D;
  --accent:#5B8CFF; --accent-ink:#06101C; --accent-soft:#14294A;
  --gold:#FFD02E; --gold-soft:#332A08;
  --bronze:#D9965C; --silver:#AEBBC9; --goldm:#FFD02E; --elite:#5B8CFF;
  --win:#2FC186; --draw:#69798D; --loss:#FF6A5C; --live:#FF4A3C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4,.disp{font-family:"Bricolage Grotesque","Instrument Sans",ui-sans-serif,system-ui,sans-serif;font-weight:800;letter-spacing:-.018em;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ shell ============ */
.shell{display:flex;min-height:100%;}
.rail{
  display:none; width:226px; flex:0 0 226px; border-right:1px solid var(--line);
  background:var(--surface); position:sticky; align-self:flex-start;
  top:env(safe-area-inset-top,0px); height:100vh; padding:18px 12px; overflow-y:auto;
}
.main{flex:1;min-width:0;padding-bottom:78px}
@media(min-width:900px){ .rail{display:block} .main{padding-bottom:40px} }

.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:16px;padding-block:0}

/* top bar */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--line-soft);
}
.topbar-in{display:flex;align-items:center;gap:10px;height:56px;max-width:var(--maxw);margin:0 auto;padding-inline:16px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brandmark{width:32px;height:32px;flex:0 0 32px;border-radius:9px;overflow:hidden;display:block;background:#0A1C3D}
.brandmark img{width:100%;height:100%;object-fit:cover;display:block}
.brandtxt{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;letter-spacing:-.03em;white-space:nowrap}
.brandtxt em{font-style:normal;color:var(--accent)}
.spacer{flex:1}
.iconbtn{
  height:34px;min-width:34px;padding:0 9px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.langtog{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.langtog button{padding:0 9px;height:32px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink-3)}
.langtog button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* rail nav */
.railhead{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:14px 10px 6px}
.navitem{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;
  color:var(--ink-2);font-weight:600;font-size:14px;text-align:left;
}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.navitem .ic{width:18px;flex:0 0 18px;display:grid;place-items:center;opacity:.9}
.navitem .badge{margin-left:auto;font-size:10px;font-weight:800;background:var(--live);color:#fff;border-radius:99px;padding:1px 6px;letter-spacing:.04em}

/* bottom nav */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-auto-flow:column;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-top:6px;
}
@media(min-width:900px){.bottomnav{display:none}}
/* On a phone the page itself does not scroll: the column between the top bar
   and the bottom bar does. A browser that hides its own toolbar while you
   scroll, or an in app webview, used to drag the bottom bar off the screen with
   it, so Statistika and Tabel went missing halfway down a long table. With the
   document standing still the bar cannot move. */
@media(max-width:899px){
  html,body{height:100%;overflow:hidden}
  .shell{height:100%;height:100dvh;overflow:hidden}
  .main{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
}
.bnav{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;color:var(--ink-3);font-size:10px;font-weight:700;letter-spacing:.01em}
.bnav[aria-current="page"]{color:var(--accent)}
.bnav svg{width:20px;height:20px}

/* favourite club hero */
.myhero{position:relative;border-radius:18px;padding:18px;margin-top:14px;color:#fff;overflow:hidden;box-shadow:var(--shadow)}
.myhero::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(6,14,24,.62),rgba(6,14,24,.26));z-index:1}
.myhero>*{position:relative;z-index:2}
.myhero .top{display:flex;align-items:center;gap:13px}
.myhero h2{font-size:22px;line-height:1.1;color:#fff}
.myhero .eyebrow{color:rgba(255,255,255,.72)}
.myhero .hstats{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px}
.myhero .hs{display:grid;gap:1px}
.myhero .hs .k{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.66)}
.myhero .hs .v{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px;line-height:1.1}
.myhero .nextm{margin-top:15px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.myhero .cd{margin-left:auto;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px;white-space:nowrap}
.myhero .fchip{box-shadow:0 0 0 1px rgba(255,255,255,.28)}
.star{width:36px;height:36px;flex:0 0 36px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-3)}
.star.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.star svg{width:17px;height:17px}
.favdot{color:var(--gold);margin-right:4px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px}
.pick{display:grid;justify-items:center;gap:6px;padding:11px 6px;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-size:11px;font-weight:700;text-align:center;line-height:1.2}
.pick.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* referee zone */
.lvl{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.lvl.bronze{color:var(--bronze)} .lvl.silver{color:var(--silver)}
.lvl.gold{color:var(--goldm)} .lvl.elite{color:var(--elite)}
.refav{width:36px;height:36px;flex:0 0 36px;border-radius:11px;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:13px;border:1px solid var(--line)}
.refav.w{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.rwdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px}
.rwd{border:1px solid var(--line);border-radius:15px;background:var(--surface);padding:14px;display:grid;gap:7px;align-content:start}
.rwd .rtop{display:flex;align-items:flex-start;gap:8px}
.rwd b{font-size:14.5px;font-weight:700;line-height:1.25}
.rwd .cost{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px;color:var(--accent);white-space:nowrap;margin-left:auto}
.rwd p{margin:0;font-size:12.5px;color:var(--ink-2)}
.rwd .sp{font-size:11px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:6px;margin-top:2px}
.rwd.slot .sp{color:var(--accent)}
.sponwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:10px}
.spon{border:1px dashed var(--line);border-radius:13px;padding:18px 12px;text-align:center;color:var(--ink-3);font-size:12px;font-weight:700;background:var(--surface)}
.spon small{display:block;font-weight:600;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;margin-top:4px;color:var(--ink-3);opacity:.8}
.earnrow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.earnrow:last-child{border-bottom:none}
.earnrow b{margin-left:auto;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;color:var(--accent);white-space:nowrap}
.prog{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:7px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.needchip{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:color-mix(in srgb,var(--loss) 16%,transparent);color:var(--loss);border:1px solid color-mix(in srgb,var(--loss) 34%,transparent)}
.ctaband{border-radius:18px;padding:20px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%, #0B1B34));color:#fff;margin-top:14px;box-shadow:var(--shadow)}
.ctaband h2{color:#fff;font-size:21px;max-width:26ch}
.ctaband p{margin:8px 0 0;font-size:13.5px;color:rgba(255,255,255,.86);max-width:56ch}
.ctaband .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.ctaband .chips span{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:700}

/* date navigator */
.daynav{
  position:sticky; top:calc(56px + env(safe-area-inset-top,0px)); z-index:30;
  background:color-mix(in srgb, var(--ground) 92%, transparent);
  backdrop-filter:saturate(1.4) blur(14px);
  margin-inline:-16px; padding-inline:16px; border-bottom:1px solid var(--line-soft);
}
.dayrow{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 0}
.railarrow{
  display:none;flex:0 0 34px;height:62px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);
}
.railarrow:hover:not([disabled]){border-color:var(--accent);color:var(--accent)}
.railarrow[disabled]{opacity:.32;cursor:default}
@media(min-width:720px){.railarrow{display:grid;place-items:center}}
.daterail{
  display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;flex:0 1 auto;min-width:0;
  scroll-snap-type:x proximity;padding:3px 0;-webkit-overflow-scrolling:touch;
  scroll-padding-inline:40%;
}
.daterail::-webkit-scrollbar{display:none}
.daychip{
  scroll-snap-align:center;flex:0 0 auto;width:60px;padding:8px 4px 9px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);display:grid;justify-items:center;gap:1px;
  position:relative;transition:transform .18s ease,background .18s ease,border-color .18s ease;
}
.daychip:hover{border-color:var(--ink-3)}
.daychip .dow{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.daychip .dnum{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;line-height:1.05}
.daychip .dmon{font-size:9.5px;color:var(--ink-3);font-weight:600}
.daychip .dcount{
  position:absolute;top:-6px;right:-5px;min-width:17px;height:17px;border-radius:99px;
  background:var(--surface-3);color:var(--ink-2);font-size:9.5px;font-weight:800;
  display:grid;place-items:center;padding:0 4px;border:2px solid var(--ground);
}
.daychip.hasLive .dcount{background:var(--live);color:#fff;border-color:var(--ground)}
.daychip.isToday{border-color:var(--accent)}
.daychip.isToday .dnum{color:var(--accent)}
.daychip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);transform:translateY(-2px)}
.daychip[aria-pressed="true"] .dow,.daychip[aria-pressed="true"] .dmon{color:color-mix(in srgb,var(--ground) 68%,transparent)}
.daychip[aria-pressed="true"] .dnum{color:var(--ground)}
.dayhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:20px 0 12px}
.dayhead h2{font-size:23px;letter-spacing:-.025em}
.dayhead .sub{font-size:12.5px;color:var(--ink-3);font-weight:600}
.daypanel{animation:slidein .26s cubic-bezier(.22,.8,.3,1)}
.daypanel.rev{animation:slideinrev .26s cubic-bezier(.22,.8,.3,1)}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes slideinrev{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.swipehint{display:flex;justify-content:center;gap:6px;color:var(--ink-3);font-size:11px;font-weight:600;padding:16px 0 4px}
@media(min-width:720px){.swipehint{display:none}}

/* section tabs */
.reftap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.bigbtn{padding:22px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:800;font-size:15px;line-height:1.3;text-align:center;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.bigbtn b{font-size:17px;display:block}
.bigbtn small{font-size:11.5px;color:var(--ink-3);font-weight:600}
.bigbtn.go{background:var(--accent);border-color:var(--accent);color:#fff}
.bigbtn.go small{color:rgba(255,255,255,.8)}
.bigbtn.warn{background:#7a2020;border-color:#7a2020;color:#fff}
.bigbtn:disabled{opacity:.42}
.refscore{display:flex;align-items:center;justify-content:center;gap:16px;padding:18px 10px;font-family:"Bricolage Grotesque",sans-serif}
.refscore .n{font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1}
.refscore .vs{color:var(--ink-3);font-size:15px;font-weight:700}
.queuepill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--gold-soft,rgba(255,198,0,.16));color:var(--gold,#c79400)}
.livedot{display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--live);margin-right:5px}
.unoff{font-size:11px;color:var(--ink-3);text-align:center;margin-top:6px}
.subrail{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 0 2px}
.seasonsel{appearance:none;-webkit-appearance:none;padding:7px 30px 7px 13px;border-radius:99px;border:1px solid var(--line);background-color:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2.2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 9px center;background-size:14px}
.phaserail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.phaserail::-webkit-scrollbar{display:none}
.tab.sm{padding:6px 11px;font-size:12px}
.adslot{position:relative;display:block;margin:14px 0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface);line-height:0}
.adslot img{width:100%;height:auto;display:block}
.adlab{position:absolute;top:7px;right:7px;background:rgba(8,14,26,.72);color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:3px 7px;border-radius:99px;line-height:1.4;backdrop-filter:blur(4px)}
.adslot.house{display:flex;align-items:center;min-height:78px;padding:16px 18px;line-height:1.45;border-style:dashed;background:var(--surface-2,var(--surface))}
.adslot.house .hb{display:block}
.adslot.house b{display:block;font-size:14.5px;color:var(--ink)}
.adslot.house small{display:block;font-size:12px;color:var(--ink-3)}
.adthumb{width:74px;height:40px;object-fit:cover;border-radius:7px;background:var(--surface-2,var(--line));flex:0 0 74px}
.imgfield{display:grid;gap:8px}
.imgprev img{width:100%;border-radius:10px;display:block}
.chipwrap{display:flex;flex-wrap:wrap;gap:6px;max-height:210px;overflow-y:auto}
.pick2{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;
  padding:7px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.pick2:hover{background:var(--accent-soft);border-color:var(--accent)}
.avat{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface-2)}
.avat.sm{width:22px;height:22px}
.avin{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--accent);color:#fff;font-weight:800;font-size:16px;letter-spacing:.02em}
.prow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:0;border-bottom:1px solid var(--line-soft);

var TODAY="2026-09-19";
/* Curacao is UTC-4 all year, no daylight saving. The plain UTC date would tip
   over to tomorrow at 20:00 local, in the middle of the evening kick offs, so
   tonight's match would show up as yesterday's. */
var TZ_OFFSET_MS = -4*3600*1000;
function today(){ return new Date(Date.now()+TZ_OFFSET_MS).toISOString().slice(0,10); }
function idx(arr){var o={};(arr||[]).forEach(function(x){o[x.id]=x});return o}
var C={},P={},DV={};
/* A season you opened yourself, before the federation has published a single
   fixture for it. It lives in your own published content, so a data refresh
   cannot wipe it, and it carries its club list so the table can stand at nil
   for every club until the first match is played. */
/* Fixtures you put in by hand, because the federation posts the schedule late
   or not at all. They live in your published content, so a data refresh cannot
   wipe them, and they step aside the moment the federation publishes the same
   fixture so nobody sees the game twice. */
/* When the federation finally publishes a fixture we had put in by hand, their
   match takes over and ours steps aside. The score our referee sent in is
   stored against our own id, so without this map it would be left behind on a
   fixture nobody can see any more. */
var OWNMAP={};
function mergeOwnMatches(){
  OWNMAP={};
  var list=DATA.ownmatches;
  if(!Array.isArray(list) || !list.length) return;
  var have={}, byKey={}, key=function(m){ return m.div+"|"+m.date+"|"+m.home+"|"+m.away };
  (DATA.matches||[]).forEach(function(m){ have[m.id]=1; have[key(m)]=1; byKey[key(m)]=m.id });
  list.forEach(function(m){
    if(!m || !m.id || have[m.id]) return;
    if(have[key(m)]){                            /* the federation has it now */
      OWNMAP[m.id]=byKey[key(m)];
      return;
    }
    DATA.matches.push(Object.assign({
      md:0, group:"", venue:"", ref:"", hs:0, as:0, status:"sched",
      events:[], att:0, potm:"", officials:{ref:"",ar1:"",ar2:"",fourth:""},
      respect:{home:0,away:0}
    }, m, { own:true }));
    have[m.id]=1; have[key(m)]=1;
  });
}

function mergeNewSeasons(){
  var list=DATA.newseasons;
  if(!Array.isArray(list) || !list.length) return;
  var have={}; (DATA.divisions||[]).forEach(function(d){ have[d.id]=1 });
  list.forEach(function(n){
    if(!n || !n.id || have[n.id]) return;
    DATA.divisions.push({
      id:n.id, name:n.name||n.id, short:n.short||n.name||n.id, en:n.en||n.name||n.id,
      type:n.type||"league", season:String(n.season||""), status:n.status||"live",
      tier:+n.tier||0, cfu:+n.cfu||0, groups:n.groups||[], roster:(n.clubs||[]).slice(), fresh:true, final:n.final||null
    });
    have[n.id]=1;
  });
}
function reindex(){ mergeNewSeasons(); mergeOwnMatches(); C=idx(DATA.clubs); P=idx(DATA.players); DV=idx(DATA.divisions); }
reindex();

var adPick={};
function adsOf(slot){
  var t=today();
  return (DATA.ads||[]).filter(function(a){
    return a.active!==false && a.slot===slot && a.img &&
      (!a.from||a.from<=t) && (!a.to||a.to>=t);
  });
}
function adCard(a){
  var lab='<span class="adlab">'+esc(LANG==="pa"?"Publisidat":"Ad")+'</span>';
  var img='<img src="'+esc(a.img)+'" alt="'+esc(a.name||"")+'" loading="lazy">';
  if(a.link) return '<a class="adslot" data-adclick="'+esc(a.id)+'" href="'+esc(a.link)+'" target="_blank" rel="noopener sponsored">'+img+lab+'</a>';
  return '<div class="adslot">'+img+lab+'</div>';
}
function houseAd(){
  var s=DATA.adsettings||{};
  if(!s.house) return '';
  var head=LANG==="pa"?(s.pa||"Bo reklame aki"):(s.en||"Your ad here");
  var sub=LANG==="pa"?"Yega na tur fanátiko di futbòl na Kòrsou":"Reach every football fan in Curaçao";
  var inner='<span class="hb"><b>'+esc(head)+'</b><small>'+esc(sub)+'</small></span><span class="adlab">'+esc(LANG==="pa"?"Publisidat":"Ad")+'</span>';
  return s.link? '<a class="adslot house" href="'+esc(s.link)+'" target="_blank" rel="noopener">'+inner+'</a>'
               : '<div class="adslot house">'+inner+'</div>';
}
function adFor(slot){
  if(adPick[slot]!==undefined) return adPick[slot];
  var pool=adsOf(slot), out;
  if(!pool.length) out=houseAd();
  else{
    var total=pool.reduce(function(s,a){return s+(+a.w||1)},0), r=Math.random()*total, pick=pool[0];
    for(var i=0;i<pool.length;i++){ r-=(+pool[i].w||1); if(r<=0){ pick=pool[i]; break } }
    out=adCard(pick);
    track("adview", pick.id);      /* one per placement per screen, not per repaint */
  }
  adPick[slot]=out;
  return out;
}




/* Points rates are written per competition family; matches carry season ids.
   Same mapping the server uses, so the app never shows different numbers. */
function refWeight(divId){
  var R2=DATA.refrules||{div:{}};
  if(R2.div && R2.div[divId]!=null) return R2.div[divId];
  var dv=DV[divId];
  var key=null;
  if(dv){
    if(dv.type==="cup") key=/(^|\s)W(\s|$)/.test(dv.short||"")?"femenino":"kopa";
    else if(dv.tier===1) key="prome";
    else if(dv.tier===2) key="segundo";
    else if(dv.tier===3) key="terser";
    else if(dv.tier===4) key="femenino";
  }
  if(key && R2.div && R2.div[key]!=null) return R2.div[key];
  return 16;
}

var API = (DATA.api || "").replace(/\/+$/, "");

function api(path, opts){
  if(!API) return Promise.reject(new Error("no api"));
  opts = opts || {};
  var h = opts.headers || {};
  h["content-type"] = "application/json";
  if(opts.auth && REF && REF.token) h["authorization"] = "Bearer " + REF.token;
  else if(opts.fan && FANU && FANU.token) h["authorization"] = "Bearer " + FANU.token;
  return fetch(API + path, {
    method: opts.method || "GET",
    headers: h,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    return r.json().catch(function(){ return {} }).then(function(j){
      if(!r.ok){
        /* The server has stopped recognising this sign in. Showing an Editor that
           cannot save is worse than saying so, so drop the session and say it. */
        if(opts.auth && (r.status===401 || r.status===403)){
          REF=null; lsSet("kf.ref",null); refMatches=null; refReload(); ADMREFS=null;
          try{ toast(LANG==="pa"?"Bo seshon a kaba. Drenta di nobo.":"Your session has ended. Sign in again."); render(); }catch(e){}
        }
        if(opts.fan && r.status===401){
          FANU=null; lsSet("kf.fanacct",null); LB=null;
        }
        throw Object.assign(new Error(j.error || ("http " + r.status)), { status: r.status, data: j });
      }
      return j;
    });
  });
}

   install button anywhere on the screen, so somebody has to be told, in two

   an iPhone, notifications included, only works once it is added, so this is

function standalone(){
  try{

function isIOS(){
  var ua=navigator.userAgent||"";

  /* An iPad on iPadOS says it is a Mac, and gives itself away by the touch. */
  return /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
}

    toast(LANG==="pa"
      ? "Promé pone e app riba bo pantaya di kas: Share, Add to Home Screen."
      : "Add the app to your home screen first: Share, then Add to Home Screen.");
    return;
  }
  if(!notifSupported()){ toast(LANG==="pa"?"E telefon aki no ta permití notifikashon":"This phone cannot show notifications"); return }
  try{
    Notification.requestPermission().then(function(perm){
      NOTIF.on = perm === "granted"; notifSave();
      toast(NOTIF.on ? (LANG==="pa"?"Notifikashon ta sendí":"Notifications are on")
                     : (LANG==="pa"?"Notifikashon ta blokiá":"Notifications are blocked"));
      pushSync();
      render();
    }).catch(function(){});
  }catch(e){}
}

/* ---- push, so a goal reaches a phone with the app shut ----
   The app asks the server for the public key, subscribes through the service
   worker, and sends the subscription up with what this person follows. If any
   of that is missing the app still works: notifications then only arrive while
   it is open, which is what it did before. */
var PUSHKEY=null, pushBusy=false;
function pushable(){
  return notifSupported() && "serviceWorker" in navigator && "PushManager" in window && !!API;
}
function pushKeyLoad(){
  if(!pushable() || PUSHKEY!==null) return Promise.resolve(PUSHKEY);
  PUSHKEY="";
  return api("/push/key").then(function(j){ PUSHKEY=(j&&j.key)||""; return PUSHKEY })
    .catch(function(){ PUSHKEY=""; return "" });
}
function urlB64(s){
  var pad="=".repeat((4-s.length%4)%4);
  var raw=atob((s+pad).replace(/-/g,"+").replace(/_/g,"/"));
  var out=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}
function subBody(sub){
  var j=sub.toJSON?sub.toJSON():sub;
  return {
    endpoint:j.endpoint, keys:j.keys,
    clubs:(FAN&&FAN.clubs)||[], matches:Object.keys(FANM||{}),
    notif:NOTIF, lang:LANG
  };
}
function pushSync(){
  if(!pushable() || pushBusy) return;
  pushBusy=true;
  pushKeyLoad().then(function(key){
    if(!key) { pushBusy=false; return }
    return navigator.serviceWorker.ready.then(function(reg){
      if(!reg || !reg.pushManager) return;
      return reg.pushManager.getSubscription().then(function(existing){
        if(!NOTIF.on){
          if(!existing) return;
          var ep=existing.endpoint;
          return existing.unsubscribe().then(function(){
            return api("/push/unsubscribe",{method:"POST",body:{endpoint:ep}}).catch(function(){});
          });
        }
        if(existing) return api("/push/subscribe",{method:"POST",fan:true,body:subBody(existing)}).catch(function(){});
        return reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64(key)})
          .then(function(sub){ return api("/push/subscribe",{method:"POST",fan:true,body:subBody(sub)}) })
          .catch(function(){});
      });
    });
  }).then(function(){ pushBusy=false }).catch(function(){ pushBusy=false });
}

function notifMine(m){
  /* A match somebody starred is always theirs, whatever the club filter says. */
  if(typeof FANM !== "undefined" && FANM && FANM[m.id]) return true;
  if(!NOTIF.mine) return true;
  var f = (typeof FAN !== "undefined" && FAN && FAN.clubs) || [];
  return f.indexOf(m.home) >= 0 || f.indexOf(m.away) >= 0;
}

function notifMatch(m, prev, next){
  if(!NOTIF.on || !notifMine(m)) return;
  var H = club(m.home).short, A = club(m.away).short, name = H + " - " + A;
  var score = next.hs + " - " + next.as;
  var min = next.status === "ht" ? "HT" : minuteLabel(next);
  function once(kind, extra){
    var tag = m.id + ":" + kind + (extra || "");
    if(notifSeen[tag]) return false;
    notifSeen[tag] = 1; return true;
  }
  var wasLive = prev.status === "live" || prev.status === "ht";
  if(NOTIF.kick && !wasLive && next.status === "live" && !next.confirmed && once("kick"))
    notifShow((LANG==="pa"?"E partido a kuminsá":"Kick off") + ": " + name,
              LANG==="pa"?"Sigui e partido bibu":"Follow it live", m.id);
  if(NOTIF.goal && (next.hs + next.as) > (prev.hs + prev.as) && once("goal", ":" + next.hs + "-" + next.as))
    notifShow("\u26BD " + name + "   " + score, min, m.id);
  if(NOTIF.ht && next.status === "ht" && prev.status !== "ht" && once("ht"))
    notifShow((LANG==="pa"?"Mitar tempo":"Half time") + ": " + name + "   " + score, "HT", m.id);
  if(NOTIF.ft && next.confirmed && !prev.confirmed && once("ft"))
    notifShow((LANG==="pa"?"Final":"Full time") + ": " + name + "   " + score,
              LANG==="pa"?"Resultado final":"Final score", m.id);
}

/* Matches that could plausibly be in progress, so we only poll when it matters. */
function liveWindow(){
  var t = today(), n = Date.now();
  /* Anything the referee has actually opened counts as live, however late it
     runs and whatever the federation feed still says. */
  for(var k in LIVE.byId){
    var x = LIVE.byId[k];
    if(x && (x.status === "live" || x.status === "ht")) return true;
  }
  return DATA.matches.some(function(m){
    if(m.date !== t) return false;
    if(m.status === "live" || m.status === "ht") return true;
    var ko = new Date(m.date + "T" + (m.time || "00:00") + ":00-04:00").getTime();
    return n > ko - 20*60000 && n < ko + 4*3600000;
  });
}

function applyLive(feed){
  if(!feed || !feed.matches) return false;
  var changed = false;
  LIVE.at = Date.now();
  feed.matches.forEach(function(x){
    var prevX = LIVE.byId[x.id] || { status:"sched", hs:0, as:0, confirmed:false };
    LIVE.byId[x.id] = x;
    var want = x.id, alias = OWNMAP[x.id] || "";
    var m = DATA.matches.filter(function(y){ return y.id === want || (alias && y.id === alias) })[0];
    if(!m) return;
    /* The very first poll of a session is only a baseline: nobody wants eight
       pings the moment they open the app. */
    if(notifReady) try{ notifMatch(m, prevX, x) }catch(e){}
    /* A score the referee has signed off yields to the federation's own final
       once they publish one. A match still in progress cannot clash with them,
       so the live overlay always wins there. */
    if(m.ffkFinal && x.confirmed) return;
    var was = m.status + "|" + m.hs + "|" + m.as + "|" + m.minute;
    m.status = x.status === "ht" ? "live" : x.status;
    m.ht = x.status === "ht";
    if(x.status === "aband") m.status = "aband";
    m.note = x.note || "";
    m.h1At = x.h1At || null;
    m.h2At = x.h2At || null;
    m.minute = x.minute;
    m.hs = x.hs; m.as = x.as;
    m.liveFeed = true;
    m.unofficial = !x.confirmed;
    if(x.events && x.events.length){
      m.events = x.events.map(function(e){
        return { min: e.min, t: e.type, team: e.team, pname: e.player || "",
                 assist: e.assist || "", id: e.id };
      });
    }
    if(was !== m.status + "|" + m.hs + "|" + m.as + "|" + m.minute) changed = true;
  });
  notifReady = true;
  return changed;
}

/* Every final score the referees have signed off this season. /live only carries
   the last few hours, so without this the table would forget a result the moment
   it went cold. */
var OURRES = null;

/* Which finals came from the federation's own file, recorded before any of our
   own scores are laid on top. Without this there is no way to tell, later, who
   a final score belongs to. */
function stampFFK(d){
  ((d && d.matches) || []).forEach(function(m){ m.ffkFinal = m.status === "ft" });
}

/* Our referee scores fill the gap until the federation publishes. The moment
   their file carries a final for a match, theirs is the official one and takes
   over, so a referee's slip corrects itself instead of sitting on the screen. */
function applyOurResults(){
  if(!Array.isArray(OURRES)) return false;
  var byId = {};
  DATA.matches.forEach(function(m){ byId[m.id]=m });
  var changed = false;
  OURRES.forEach(function(r){
    var m = byId[r.id] || byId[OWNMAP[r.id]];
    if(!m || m.ffkFinal) return;
    if(m.status!=="ft" || m.hs!==r.hs || m.as!==r.as){
      m.status="ft"; m.hs=r.hs; m.as=r.as; m.ours=true; changed=true;
    } else { m.ours=true; }
  });
  return changed;
}

function loadResults(){
  if(!API || OURRES==="loading") return;
  OURRES="loading";
  api("/results").then(function(j){
    OURRES = j.results || [];

function haveOurResults(divId){

/* Our table is used only where the admin has asked for it. The federation file
   stays the default, and stays available as a cross check. */
function useOurTable(divId){
  var on = DATA.ourtables && DATA.ourtables[divId];
  return !!on && haveOurResults(divId);
}

function pollLive(){
  if(!API) return Promise.resolve();
  return api("/live?t=" + Date.now()).then(function(f){
    if(applyLive(f)) render();

/* The cadence is decided after every poll, not once when the app opened. A goal
   tapped by the referee has to reach a phone in seconds, so as soon as a match is
   running we are on the short interval, even if the app was opened hours before. */
function liveLoop(){
  if(liveTimer) clearTimeout(liveTimer);
  if(!API) return;
  (function tick(){
    var run = document.hidden ? Promise.resolve() : pollLive();
    run.then(function(){
      if(liveTimer) clearTimeout(liveTimer);
      liveTimer = setTimeout(tick, liveWindow() ? 12000 : 120000);
    });
  })();
}
document.addEventListener("visibilitychange", function(){ if(!document.hidden) pollLive() });

/* ───────── referee actions, with an offline queue ───────── */

function refQueue(path, body){
  RQ.push({ path: path, body: body, at: Date.now() });
  lsSet("kf.refq", RQ);
  render();
}
function refFlush(){
  if(!RQ.length || !API || !REF) return Promise.resolve();
  var job = RQ[0];
  return api(job.path, { method: "POST", body: job.body, auth: true })
    .then(function(){
      RQ.shift(); lsSet("kf.refq", RQ);
      return RQ.length ? refFlush() : null;
    })
    .catch(function(e){
      /* A rejection the server will never accept must not block the queue forever. */
      if(e.status && e.status >= 400 && e.status < 500 && e.status !== 429){
        RQ.shift(); lsSet("kf.refq", RQ);
        return RQ.length ? refFlush() : null;
      }
      throw e;
    });
}
function refSend(path, body){
  if(!API || !REF) return Promise.reject(new Error("offline"));
  return refFlush().then(function(){
    return api(path, { method: "POST", body: body, auth: true });
  }).catch(function(e){
    if(!e.status){ refQueue(path, body); return { queued: true } }
    throw e;
  });
}
setInterval(function(){ if(RQ.length && !document.hidden) refFlush().then(render).catch(function(){}) }, 15000);

/* ---------------- the match clock ----------------
   The referee presses kick off once. From then on the minute runs by itself,
   worked out from the two whistle times the server keeps, so every phone shows
   the same minute and nothing drifts while a phone is asleep. */
function liveMinute(o){
  if(!o) return 0;
  if(o.status === "ht") return 45;
  var anchor = o.h2At || o.h1At;
  if(!anchor) return o.minute || 0;
  var t = Date.parse(anchor);
  if(!t) return o.minute || 0;
  var mins = Math.floor((Date.now() - t) / 60000);
  var base = o.h2At ? 45 : 0;
  if(mins < 0) return base;
  return Math.min(130, base + mins);
}
function minuteLabel(o){
  if(!o) return "";
  if(o.status === "ht") return "HT";
  var mn = liveMinute(o);
  if(o.h2At) return mn > 90 ? "90+" + (mn - 90) : mn + "\u2032";
  if(o.h1At) return mn > 45 ? "45+" + (mn - 45) : mn + "\u2032";
  return mn ? mn + "\u2032" : T("live");
}
/* The running clock on screen, to the second: 23:07, 45+2:15, 67:12, 90+4:03.
   Worked out from the same whistle times as the minute, so every phone shows
   the same second. Notifications and goal times keep the plain minute (67'). */
function clockLabel(o){
  if(!o) return "";
  if(o.status === "ht") return "HT";
  var anchor = o.h2At || o.h1At, t = anchor ? Date.parse(anchor) : 0;
  if(!t) return minuteLabel(o);
  var secs = Math.max(0, Math.floor((Date.now() - t) / 1000));
  var base = o.h2At ? 45 : 0, cap = o.h2At ? 90 : 45;
  var total = Math.min(130 * 60, base * 60 + secs), mm = Math.floor(total / 60), ss = total % 60;
  var two = function(n){ return (n < 10 ? "0" : "") + n };
  if(mm >= cap) return cap + "+" + (mm - cap) + ":" + two(ss);
  return two(mm) + ":" + two(ss);
}
/* Wherever the minute is on screen, find the freshest thing that knows it. */
function clockSrc(id){
  var x = LIVE.byId[id];
  if(x && (x.h1At || x.h2At || x.status === "ht")) return x;
  var rm = (refMatches || []).filter(function(y){ return y.id === id })[0];
  if(rm && rm.state && (rm.state.h1At || rm.state.h2At || rm.state.status === "ht")) return rm.state;
  var m = DATA.matches.filter(function(y){ return y.id === id })[0];
  if(!m) return null;
  return { status: m.ht ? "ht" : m.status, minute: m.minute, h1At: m.h1At, h2At: m.h2At };
}
function clockSpan(id){
  return '<span class="clk" data-clk="' + esc(id) + '">' + esc(clockLabel(clockSrc(id))) + '</span>';
}
/* Ticking the text only, never a re-render: a re-render would wipe whatever the
   referee is halfway through typing. */
function clockTick(){
  var els = document.querySelectorAll("[data-clk]");
  for(var i = 0; i < els.length; i++){
    var lab = clockLabel(clockSrc(els[i].getAttribute("data-clk")));
    if(els[i].textContent !== lab) els[i].textContent = lab;
  }
}
setInterval(function(){ if(!document.hidden) clockTick() }, 1000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) clockTick() });

function refGuessMinute(mid){
  var m=(refMatches||[]).filter(function(x){return x.id===mid})[0];
  if(m&&m.state&&(m.state.h1At||m.state.h2At)) return liveMinute(m.state);
  if(m&&m.state&&m.state.minute) return m.state.minute;
  if(m&&m.time){
    var ko=new Date(m.date+"T"+m.time+":00").getTime();
    var mins=Math.floor((Date.now()-ko)/60000);
    if(mins>0&&mins<130) return mins;
  }
  return 0;
}

/* ───────── competition grouping ───────── */
var COMP_NAMES={kopa:["Kopa Kòrsou","Kopa"],kopaw:["Kopa Kòrsou W","Kopa W"],prome:["Promé Divishon","Promé"],
  segunda:["Segunda Divishon","Segunda"],terser:["Terser Divishon","Terser"],femenino:["Femenino","Femenino"]};
function compKey(d){
  if(!d) return "";
  if(d.comp) return d.comp;
  var n=(d.name||"")+" "+(d.short||"");
  if(/kopa/i.test(n)&&/(^|\s)W(\s|$)/.test(d.short||"")) return "kopaw";
  if(/kopa/i.test(n)) return "kopa";
  if(/prom/i.test(n)) return "prome";
  if(/segunda/i.test(n)) return "segunda";
  if(/terser/i.test(n)) return "terser";
  if(/femenin/i.test(n)) return "femenino";
  return "t"+(d.tier==null?9:d.tier);
}
function compKeyOf(id){ return compKey(DV[id]) }
function compName(d){ var k=compKey(d); return d.compName||(COMP_NAMES[k]&&COMP_NAMES[k][0])||d.short||d.name||"" }
function compShort(d){ var k=compKey(d); return d.compShort||(COMP_NAMES[k]&&COMP_NAMES[k][1])||d.short||"" }
function seasonLabel(d){
  if(!d) return "";
  if(d.syr) return d.syr;
  var m=(d.name||"").match(/(\d{4})\s*[-\/]\s*(\d{2,4})/);
  return m?(m[1]+"/"+m[2].slice(-2)):(d.season||"");
}
function phaseLabel(d){
  if(!d) return "";
  if(d.phase!=null) return d.phase;
  var m=(d.short||"").match(/fase\s*([\wÀ-ÿ]+)/i)||(d.name||"").match(/fase\s*([\wÀ-ÿ]+)/i);
  return m?("Fase "+m[1]):"";
}
function phaseNum(d){ var m=phaseLabel(d).match(/\d+/); return m?parseInt(m[0],10):99 }
function divsOfComp(k){
  return DATA.divisions.filter(function(d){return compKey(d)===k})
    .sort(function(a,b){return String(b.season||"").localeCompare(String(a.season||""))});
}
function seasonsOf(k){
  var out=[],seen={};
  divsOfComp(k).forEach(function(d){ if(!seen[d.season]){seen[d.season]=1;out.push(d.season)} });
  return out;
}
function phasesOf(k,season){
  return DATA.divisions.filter(function(d){return compKey(d)===k&&d.season===season})
    .sort(function(a,b){return phaseNum(a)-phaseNum(b)});
}
function bestOf(list){
  return list.filter(function(d){return d.status==="live"})[0]||list[list.length-1]||list[0];
}
function pickComp(k){
  var list=divsOfComp(k);
  var live=list.filter(function(d){return d.status==="live"})[0];
  if(live) return live;
  var y=list[0]&&list[0].season;
  return bestOf(phasesOf(k,y))||list[0];
}
/* "Live" on screen means a match is being played right now, not that the
   competition is still running. d.status stays "live" for the whole season,
   which is what picks the default competition, but a red badge on a Tuesday
   afternoon with nothing on told people something was happening that was not. */
function liveNow(d){
  return !!d && DATA.matches.some(function(m){ return m.div===d.id && m.status==="live" });
}
function compList(){
  var seen={},out=[];
  DATA.divisions.forEach(function(d){
    var k=compKey(d);
    if(!seen[k]){ seen[k]={key:k,name:compName(d),short:compShort(d),type:d.type,tier:(d.tier==null?9:d.tier),live:false,now:false}; out.push(seen[k]) }
    if(d.status==="live") seen[k].live=true;
    if(liveNow(d)) seen[k].now=true;
  });
  out.sort(function(a,b){ return a.live!==b.live ? (a.live?-1:1) : a.tier-b.tier });
  return out;
}
function setComp(k){
  var d=pickComp(k); if(!d) return;
  R.div=d.id; if(R.page==="matches") R.arg="";
  render();
}


var MONTH_PA=["yan","feb","mart","apr","mei","yün","yül","oug","sèp","okt","nov","des"];
var MONTH_EN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DAY_PA=["Dom","Lun","Djam","Djaw","Djar","Djab","Sab"];
var DAY_EN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fmtDate(iso,withDay){
  if(!iso) return "";
  var p=iso.split("-"), d=new Date(+p[0],+p[1]-1,+p[2]);
  var m=(LANG==="pa"?MONTH_PA:MONTH_EN)[d.getMonth()];
  var day=(LANG==="pa"?DAY_PA:DAY_EN)[d.getDay()];
  return (withDay?day+" ":"")+d.getDate()+" "+m;
}
function relDay(iso){
  var t=today();
  if(iso===t) return T("today");
  var a=new Date(iso), b=new Date(t);
  if((a-b)/86400000===1) return T("tomorrow");
  return fmtDate(iso,true);
}

/* ───────── crest ───────── */
function crest(id,size){

  if(c.logo) return '<span class="crest logo'+s+'" aria-hidden="true"><img src="'+c.logo+'" alt=""></span>';

}

/* ───────── competitions, groups, stored tables ───────── */
var curGroup={};
/* ---------------- knockout rounds ----------------
   A cup does not end in a table, it ends in a bracket. The federation keeps the
   poules and the knock out as two separate phases, so every match that belongs
   to the knock out carries ko, and round says how deep it is: 1 is the first
   knock out round, and the last round is the final. */
function koMatchesOf(divId){
  return DATA.matches.filter(function(m){ return m.div===divId && m.ko });
}
function hasKO(divId){ return koMatchesOf(divId).length > 0 }
function koRoundName(n){
  if(n>=8) return LANG==="pa"?"Ronde di 16":"Round of 16";
  if(n===4) return LANG==="pa"?"Kuartofinal":"Quarter finals";
  if(n===3) return LANG==="pa"?"Kuartofinal":"Quarter finals";
  if(n===2) return LANG==="pa"?"Semifinal":"Semi finals";
  if(n===1) return LANG==="pa"?"Final":"Final";
  return (LANG==="pa"?"Ronde ":"Round ")+n;
}
function koRounds(divId){
  var ms=koMatchesOf(divId);
  if(!ms.length) return [];
  var by={};
  ms.forEach(function(m){ var r=+m.round||1; (by[r]=by[r]||[]).push(m) });
  return Object.keys(by).map(Number).sort(function(a,b){ return a-b }).map(function(r){
    var list=by[r].slice().sort(function(a,b){
      return (a.date+" "+(a.time||"")).localeCompare(b.date+" "+(b.time||"")) || a.id.localeCompare(b.id);
    });
    return { round:r, name:koRoundName(list.length), matches:list };
  });
}
/* Who goes through. Only stated once a result is official, never guessed. */
function koWinner(m){
  if(m.status!=="ft") return "";
  if(m.hs>m.as) return m.home;
  if(m.as>m.hs) return m.away;
  return "";
}
/* The tree itself. Which tie feeds which is read out of the data: for every tie
   in a round we look for the earlier tie its two clubs came through, so a line
   is only ever drawn where the results say so. Nothing is assumed about who
   meets whom next. */
/* The official draw, when we have it. data.kobracket[divId] lists the first
   knock out round as [home, away] pairs in bracket slot order (tools/wdb.js
   reads it from WDBSport, whose bracket the FFK draw is entered into). In a
   bracket every tie sits in the slot range of the first round ties that feed
   it, so ordering each round by the lowest slot among its two clubs puts every
   round, played or not yet drawn, in the order where neighbours meet next.
   Without this, rounds nobody has drawn yet are paired by kick off order,
   which is how Scherpenheuvel got shown against UNDEBA in the 2026 semis. */
function koSlotOrder(divId, rounds){
  var kb = DATA.kobracket && DATA.kobracket[divId];
  if(!Array.isArray(kb) || !kb.length) return false;
  var pos = {};
  kb.forEach(function(p, i){ (p || []).forEach(function(c){ if(c) pos[String(c)] = i }) });
  var at = function(c){ return pos.hasOwnProperty(String(c)) ? pos[String(c)] : 999 };
  var fits = rounds[0].matches.every(function(m){ return at(m.home) < 999 && at(m.away) < 999 });
  if(!fits) return false;
  rounds.forEach(function(R){
    R.matches.sort(function(a, b){
      return Math.min(at(a.home), at(a.away)) - Math.min(at(b.home), at(b.away));
    });
  });
  return true;
}
function koTree(divId){
  var rounds = koRounds(divId);
  if(!rounds.length) return [];
  if(koSlotOrder(divId, rounds)) return rounds;
  for(var i = rounds.length - 1; i > 0; i--){
    var parent = rounds[i], child = rounds[i-1];
    var order = [], used = {};
    parent.matches.forEach(function(pm){
      [pm.home, pm.away].forEach(function(cid){
        for(var k = 0; k < child.matches.length; k++){
          var cm = child.matches[k];
          if(used[cm.id]) continue;
          if(cm.home === cid || cm.away === cid){ order.push(cm); used[cm.id] = 1; return }
        }
      });
    });
    child.matches.forEach(function(cm){ if(!used[cm.id]){ order.push(cm); used[cm.id] = 1 } });
    child.matches = order;
  }
  return rounds;
}

var SLOT_H = 26, TIE_H = SLOT_H * 2 + 3, TIE_GAP = 16, COL_W = 132, COL_GAP = 26, HEAD_H = 22;

function koSlot(m, home, x, y){
  var id = home ? m.home : m.away, c = club(id);
  var sc = m.status === "ft" || m.status === "live" ? (home ? m.hs : m.as) : "";
  var won = koWinner(m) === id, out = m.status === "ft" && !won;
  return '<button class="kobox'+(won?' kowin':'')+(out?' koout':'')+'" data-match="'+esc(m.id)+'" '+
    'style="left:'+x+'px;top:'+y+'px;width:'+COL_W+'px;height:'+SLOT_H+'px">'+
    (c.logo?'<img src="'+esc(c.logo)+'" alt="">':'<i class="kodot" style="background:'+esc(c.c1||"#888")+'"></i>')+
    '<b>'+esc(c.short||c.name||"")+'</b><span>'+sc+'</span></button>';
}
/* A club that is through but whose next tie has not been drawn yet. We park it
   in the next column on its own, with no line joining it to anybody, because
   the opponent is genuinely not known. */
function koWaiting(id, x, y){
  var c = club(id);
  return '<span class="kobox kowait" style="left:'+x+'px;top:'+y+'px;width:'+COL_W+'px;height:'+SLOT_H+'px">'+
    (c.logo?'<img src="'+esc(c.logo)+'" alt="">':'<i class="kodot" style="background:'+esc(c.c1||"#888")+'"></i>')+
    '<b>'+esc(c.short||c.name||"")+'</b></span>';
}

/* The whole road to the final, not just the rounds the federation has drawn.
   Rounds that are not played yet are laid out as open ties: a slot fills in
   with a club the moment it wins the tie that feeds it, and until then says
   which tie it is waiting on. The ties are paired in bracket order (tie 1 and
   2 meet, 3 and 4 meet). As soon as the federation publishes the real next
   round, the real fixtures replace these open ties. */
function koBracket(divId){
  var real = koTree(divId);
  if(!real.length) return '';
  var pa = LANG === "pa";
  var cols = real.map(function(R2){ return { name:R2.name, real:true, ties:R2.matches.map(function(m){ return { m:m } }) } });

  function sideOf(col, k){
    var t = col.ties[k];
    if(!t) return { id:'', label:'' };
    var win = t.m ? koWinner(t.m) : '';
    var label;
    if(t.m){
      label = (pa ? "Ganadó " : "Winner ") + (club(t.m.home).abbr || "?") + "/" + (club(t.m.away).abbr || "?");
    } else {
      var nt = col.ties.length;
      var one = nt === 2 ? "semi" : nt <= 4 ? (pa ? "kuarto" : "quarter") : (pa ? "ronde" : "tie");
      label = (pa ? "Ganadó " : "Winner ") + one + " " + (k + 1);
    }
    return { id:win, label:label };
  }
  var n = cols[cols.length-1].ties.length;
  while(n > 1){
    var prev = cols[cols.length-1], nt = Math.ceil(n / 2), ties = [];
    for(var j = 0; j < nt; j++){
      var fa = prev.ties[2*j], fb = prev.ties[2*j+1];
      var feed = [fa && (fa.m ? fa.m.id : fa.ot && fa.ot.id), fb && (fb.m ? fb.m.id : fb.ot && fb.ot.id)];
      var ot = (DATA.openties||[]).filter(function(o){
        return o.div===divId && o.home && o.away && feed.indexOf(o.home.from)>=0 && feed.indexOf(o.away.from)>=0;
      })[0] || null;
      ties.push({ m:null, ot:ot, home:sideOf(prev, 2*j), away:sideOf(prev, 2*j+1) });
    }
    cols.push({ name:koRoundName(nt), real:false, ties:ties });
    n = nt;
  }

  var ys = [];
  ys[0] = cols[0].ties.map(function(t, j){ return HEAD_H + j * (TIE_H + TIE_GAP) });
  for(var r = 1; r < cols.length; r++){
    ys[r] = cols[r].ties.map(function(t, j){
      var a = ys[r-1][2*j], b = ys[r-1][2*j+1];
      if(a === undefined) a = ys[r-1][j] !== undefined ? ys[r-1][j] : HEAD_H;
      if(b === undefined) b = a;
      return (a + b) / 2;
    });
  }

  var lastCol = cols[cols.length-1];
  var champ = lastCol.real && lastCol.ties.length === 1 ? koWinner(lastCol.ties[0].m) : "";

  var ncol = cols.length + (champ ? 1 : 0);
  var W = ncol * COL_W + (ncol - 1) * COL_GAP;
  var H = HEAD_H + cols[0].ties.length * (TIE_H + TIE_GAP);

  function openSlot(side, x, y){
    if(side.id) return koWaiting(side.id, x, y);
    return '<span class="kobox kowait koopen" style="left:'+x+'px;top:'+y+'px;width:'+COL_W+'px;height:'+SLOT_H+'px">'+
      '<b>'+esc(side.label)+'</b></span>';
  }

  var nodes = '', heads = '', lines = '';
  cols.forEach(function(col, r){
    var x = r * (COL_W + COL_GAP);
    heads += '<span class="kohead" style="left:'+x+'px;width:'+COL_W+'px">'+esc(col.name)+'</span>';
    col.ties.forEach(function(t, j){
      var y = ys[r][j];
      if(t.m) nodes += koSlot(t.m, true, x, y) + koSlot(t.m, false, x, y + SLOT_H + 3);
      else nodes += openSlot(t.home, x, y) + openSlot(t.away, x, y + SLOT_H + 3);
      var dsrc = t.m ? (t.m.status==="ft" ? null : t.m) : t.ot;
      if(dsrc && dsrc.date) nodes += '<span class="kodate" style="left:'+x+'px;top:'+(y + TIE_H + 1)+'px;width:'+COL_W+'px">'+
        esc(fmtDate(dsrc.date,true)+(dsrc.time?" · "+dsrc.time:""))+'</span>';
      if(r + 1 < cols.length){
        var py = ys[r+1][Math.floor(j / 2)];
        if(py !== undefined){
          var x1 = x + COL_W, x2 = x + COL_W + COL_GAP;
          var y1 = y + TIE_H / 2, y2 = py + TIE_H / 2, mx = x1 + COL_GAP / 2;
          lines += '<polyline points="'+x1+','+y1+' '+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2+'"/>';
        }
      }
    });
  });
  if(champ){
    var cx = cols.length * (COL_W + COL_GAP), cy = ys[cols.length-1][0];
    heads += '<span class="kohead" style="left:'+cx+'px;width:'+COL_W+'px">'+esc(pa?"Kampion":"Champion")+'</span>';
    nodes += '<span class="kobox kowin kochamp" style="left:'+cx+'px;top:'+(cy + (TIE_H - SLOT_H)/2)+'px;width:'+COL_W+'px;height:'+SLOT_H+'px">'+
      '\u{1F3C6} <b>'+esc(club(champ).short||club(champ).name)+'</b></span>';
    var lx = cx - COL_GAP, ly = cy + TIE_H / 2;
    lines += '<polyline points="'+lx+','+ly+' '+cx+','+ly+'"/>';
  }

  return '<div class="card kowrap"><div class="kobracket" style="width:'+W+'px;height:'+H+'px">'+
    '<svg class="kolines" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+lines+'</svg>'+
    heads + nodes + '</div></div>';
}

/* Who is through, in words, under the tree. */
function koThrough(divId){
  var rounds=koRounds(divId);
  if(!rounds.length) return '';
  var last=rounds[rounds.length-1];
  var thru=last.matches.map(koWinner).filter(Boolean);
  if(!thru.length) return '';
  return '<p class="muted" style="font-size:12px;margin:10px 2px 0">'+
    esc(LANG==="pa"?"Pasa: ":"Through: ")+esc(thru.map(function(id){return club(id).short}).join(", "))+'</p>';
}

function koCard(divId){
  var rounds=koRounds(divId);
  if(!rounds.length) return '';
  var h='';
  rounds.forEach(function(R2){
    var done=R2.matches.filter(function(m){return m.status==="ft"}).length;
    h+='<div class="sechead" style="margin:14px 0 8px"><h2 style="font-size:15px">'+esc(R2.name)+'</h2>'+
       '<span class="sub">'+esc(done+" / "+R2.matches.length)+'</span></div>';
    h+=matchList(R2.matches,true);
    var thru=R2.matches.map(koWinner).filter(Boolean);
    if(thru.length) h+='<p class="muted" style="font-size:11.5px;margin:6px 2px">'+
      esc(LANG==="pa"?"Pasa: ":"Through: ")+esc(thru.map(function(id){return club(id).short}).join(", "))+'</p>';
  });
  return h;
}

function groupsOf(id){
  var d=divOf(id), gs=(d.groups||[]).slice();
  /* data.phasefix hides phases the feed got wrong and a corrected set replaced
     (Terser 2025/26: a half empty regular table and a stray poule). */
  var hide=(DATA.phasefix&&DATA.phasefix[id]&&DATA.phasefix[id].hide)||[];
  if(hide.length) gs=gs.filter(function(g){return hide.indexOf(g[0])<0});
  /* A league's phases in the order they are played: the feed sometimes lists
     Kaya 4 before Kaya 6. */
  if(d && d.type!=="cup" && typeof phaseRank==="function"){
    gs=gs.map(function(g,i){return {g:g,i:i,r:phaseRank(g[1])}})
      .sort(function(a,b){ var ra=a.r<0?999:a.r, rb=b.r<0?999:b.r; return ra-rb||a.i-b.i })
      .map(function(x){return x.g});
  }
  /* The bracket comes first: in a cup that has reached the knock out, that is
     the thing people open the app for. */
  if(hasKO(id)) gs.unshift(["__ko", LANG==="pa"?"Knock out":"Knockout"]);
  return gs;
}
function groupName(id,k){ var g=groupsOf(id).filter(function(x){return x[0]===k})[0]; return g?g[1]:k }
function activeGroup(id){
  var gs=groupsOf(id); if(!gs.length) return "";
  if(!curGroup[id]||!gs.some(function(g){return g[0]===curGroup[id]})) curGroup[id]=gs[0][0];
  return curGroup[id];
}
function storedTable(divId,g){
  var t=DATA.tables&&DATA.tables[divId]; if(!t) return null;
  return t[g||activeGroup(divId)]||null;
}
function liveComp(){
  var l=DATA.divisions.filter(function(d){return d.status==="live"})[0];
  return (l||DATA.divisions[0]).id;
}
function clubsIn(divId){
  var out={}, t=DATA.tables&&DATA.tables[divId];
  if(t) Object.keys(t).forEach(function(g){ t[g].forEach(function(r){ if(r[1]) out[r[1]]=1 }) });
  DATA.matches.forEach(function(m){ if(m.div===divId){ out[m.home]=1; out[m.away]=1 } });
  return Object.keys(out);
}

/* ───────── derived: standings ───────── */
function finished(m){return m.status==="ft"}
function matchesOf(divId){ return DATA.matches.filter(function(m){return !divId||m.div===divId}) }
/* Which clubs belong in the table on screen. A cup phase is split into poules,
   so the roster is that poule's clubs, taken from the federation's own group
   list. Because a match only counts when both its clubs are in the roster, a
   poule table works itself out from that alone. */
function rosterOf(divId){
  var out={};
  var dvr=DV[divId];
  if(dvr && dvr.roster && dvr.roster.length) return dvr.roster.slice();
  if(groupsOf(divId).length){
    var g=storedTable(divId);
    if(g && g.length){
      g.forEach(function(r){ if(r[1]) out[r[1]]=1 });
      return Object.keys(out);
    }
  }
  DATA.clubs.forEach(function(c){ if(c.div===divId) out[c.id]=1 });
  DATA.matches.forEach(function(m){ if(m.div===divId){ out[m.home]=1; out[m.away]=1 } });
  return Object.keys(out);
}

function standings(divId,mode){
  mode=mode||"all";
  var st=useOurTable(divId) ? null : storedTable(divId);
  if(st){
    var sg=activeGroup(divId);
    return st.map(function(r){
      return {pos:r[0],id:r[1],p:r[2],w:r[3],l:r[4],d:r[5],gf:r[6],ga:r[7],pts:r[8],gd:r[9],cs:0,form:phaseForm(divId,sg,r[1],st)};
    });
  }
  var rows={};
  /* A cup split into groups with no federation table (the women's Kopa): the
     group on screen is worked out from the fixtures carrying that group, so
     each group table holds only its own clubs and its own games. */
  var grp=activeGroup(divId), inGrp=null;
  if(grp && grp!=="__ko" && matchesOf(divId).some(function(m){return m.group===grp})) inGrp=function(m){return m.group===grp};
  (inGrp ? [] : rosterOf(divId)).forEach(function(cid){
    rows[cid]={id:cid,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,form:[],cs:0};
  });
  var ms=matchesOf(divId).filter(finished).filter(inGrp||function(){return true}).sort(function(a,b){return a.date.localeCompare(b.date)||a.id.localeCompare(b.id)});
  /* A club can turn up in a match without being on the season roster: a fixture
     put in by hand, or a club the federation added mid season. Give it a row
     rather than dropping the match, which would leave the table not adding up. */
  matchesOf(divId).filter(inGrp||function(){return true}).forEach(function(m){
    [m.home, m.away].forEach(function(cid){
      if(cid && !rows[cid]) rows[cid]={id:cid,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,form:[],cs:0};
    });
  });
  ms.forEach(function(m){
    var h=rows[m.home], a=rows[m.away]; if(!h||!a) return;
    if(mode!=="away"){ h.p++; h.gf+=m.hs; h.ga+=m.as; if(m.as===0)h.cs++;
      if(m.hs>m.as){h.w++;h.pts+=3;h.form.push("W")} else if(m.hs<m.as){h.l++;h.form.push("L")} else {h.d++;h.pts++;h.form.push("D")} }
    if(mode!=="home"){ a.p++; a.gf+=m.as; a.ga+=m.hs; if(m.hs===0)a.cs++;
      if(m.as>m.hs){a.w++;a.pts+=3;a.form.push("W")} else if(m.as<m.hs){a.l++;a.form.push("L")} else {a.d++;a.pts++;a.form.push("D")} }
  });
  var list=Object.keys(rows).map(function(k){var r=rows[k];r.gd=r.gf-r.ga;return r});
  list.sort(function(x,y){
    return y.pts-x.pts || y.gd-x.gd || y.gf-x.gf || club(x.id).short.localeCompare(club(y.id).short);
  });
  list.forEach(function(r,i){r.pos=i+1; r.form=r.form.slice(-5)});
  return list;
}
function groupWinnersFinal(divId){ var d=divOf(divId); return !!(d && d.final && d.final.rule==="groupwinners") }
/* How an FFK league season runs: a regular season, then smaller play-off
   rounds (Kaya 6, Kaya 4), then a final. The top of each phase goes on to the
   next: Kaya N takes the top N, the final takes the top 2, and whoever tops the
   last phase is champion. In the Promé the last club of the regular season goes
   down. The chain is read from the phases the competition has; a season that
   has not split into phases yet borrows the chain of the same division's
   previous season, since the format stays the same year to year. */
function phaseRank(name){
  var n=String(name||"").toLowerCase(), k=n.match(/kaya\s*(\d+)/);
  if(/regular|poule/.test(n)) return 0;
  if(k) return 100-(+k[1]);
  if(/final/.test(n)) return 200;
  return -1;
}
function phaseChain(divId){
  var d=divOf(divId);
  if(!d || d.type==="cup" || !(d.tier>=1 && d.tier<=3)) return null;
  var pick=function(x){ return groupsOf(x.id).filter(function(g){return phaseRank(g[1])>=0}) };
  var gs=pick(d), borrowed=false;
  if(gs.length<2){
    var prev=DATA.divisions.filter(function(x){ return x.id!==d.id && x.type!=="cup" && x.tier===d.tier && pick(x).length>1 })
      .sort(function(a,b){ return String(b.season).localeCompare(String(a.season)) })[0];
    if(!prev) return null;
    gs=pick(prev); borrowed=true;
  }
  gs=gs.slice().sort(function(a,b){ return phaseRank(a[1])-phaseRank(b[1]) });
  /* Stages: the regular season can be split into poules, which run side by
     side and send their top clubs on together. */
  var stages=[];
  gs.forEach(function(g){
    var r=phaseRank(g[1]), last=stages[stages.length-1];
    if(last && last.rank===r) last.groups.push(g); else stages.push({rank:r, groups:[g]});
  });
  return {phases:gs, stages:stages, borrowed:borrowed};
}
function stageName(st, pa){
  if(st.groups.length===1) return st.groups[0][1];
  return (pa?"Kampionato regular":"Regular season")+" ("+st.groups.length+" "+(pa?"poule":"poules")+")";
}
function phaseTake(name){

  var steps=ch.stages.map(function(st,i){

function zoneClass(divId,pos,total){
  var pz=phaseZones(divId);
  if(pz){
    if(!matchesOf(divId).some(finished) && !storedTable(divId)) return "";
    for(var zi=0; zi<pz.length; zi++){ var zz=pz[zi]; if(zz.last ? pos>total-zz.last : (pos>=zz.from && pos<=zz.to)) return zz.cls; }
    return "";
  }
  if(groupWinnersFinal(divId)) return matchesOf(divId).some(finished) && pos===1 ? "z-champ" : "";
  /* Before a ball is kicked the table is just alphabetical, so colouring the
     top row champion and the bottom rows relegated would be saying something
     false about real clubs. */
  if(!matchesOf(divId).some(finished)) return "";
  var d=divOf(divId);
  if(d.type==="cup"){ return pos===1?"z-champ":(pos===2?"z-po":"") }
  if(pos===1) return d.tier===1?"z-champ":"z-champ";
  if(d.tier===1){ if(d.cfu&&pos<=d.cfu) return "z-cfu"; if(pos===total-2) return "z-po"; if(pos>=total-1) return "z-rel"; }

  return "";
}

function convLeader(a){
  return (a||[]).map(function(r){ return {id:"",name:r[0],club:r[1],v:r[2],pos:""} });
}
/* Goals our referees recorded for matches the federation has not published a
   final for yet. Those are the ones their chart cannot know about, and counting
   only those is what keeps a goal from being counted twice. */
function pendingScorers(divId){
  var g={}, a={}, cl={};
  DATA.matches.forEach(function(m){
    if(divId && m.div!==divId) return;
    if(m.ffkFinal) return;
    if(m.status!=="ft" && m.status!=="live") return;
    (m.events||[]).forEach(function(e){
      if(e.t!=="goal" && e.t!=="pen") return;
      if(e.pname){ g[e.pname]=(g[e.pname]||0)+1; cl[e.pname]=cl[e.pname]||e.team }
      if(e.assist){ a[e.assist]=(a[e.assist]||0)+1; cl[e.assist]=cl[e.assist]||e.team }
    });
  });
  return {g:g, a:a, club:cl};
}
/* Lay ours on top of the federation's chart, adding to a name already there
   rather than showing the same player twice. */
function mergeChart(rows, counts, club){
  var out=rows.map(function(r){ return {id:r.id,name:r.name,club:r.club,pos:r.pos,v:r.v} });
  Object.keys(counts).forEach(function(n){
    var key=String(n).trim().toLowerCase();
    var hit=null;
    for(var i=0;i<out.length;i++){ if(String(out[i].name).trim().toLowerCase()===key){ hit=out[i]; break } }
    if(hit){ hit.v+=counts[n]; hit.ours=true }
    else out.push({id:"",name:n,club:club[n]||"",pos:"",v:counts[n],ours:true});
  });
  return out.sort(function(x,y){ return y.v-x.v || String(x.name).localeCompare(String(y.name)) });
}

    return {stored:true,

            assists:mergeChart(convLeader(L.assists), pend.a, pend.club),
            clean:convLeader(L.clean),yc:convLeader(L.yc),rc:convLeader(L.rc),
            mins:convLeader(L.mins),ga:[],rawG:{},rawA:{}};
  }
  var g={},a={},yc={},rc={},apps={};
  /* Referee entered goals carry a name, not one of our player ids, because most
     of these players are in no squad file we hold. They are counted by name, in
     their own maps, and merged into the chart below. */
  var gn={},an={},nclub={};
  DATA.matches.forEach(function(m){
    if(divId && m.div!==divId) return;
    if(m.status!=="ft" && m.status!=="live") return;

                    if(e.assist){ an[e.assist]=(an[e.assist]||0)+1; nclub[e.assist]=nclub[e.assist]||e.team } }
        else { g[e.p]=(g[e.p]||0)+1; if(e.a) a[e.a]=(a[e.a]||0)+1 }
      }
      else if(e.t==="yc"){ if(!byName) yc[e.p]=(yc[e.p]||0)+1 }
      else if(e.t==="rc"){ if(!byName) rc[e.p]=(rc[e.p]||0)+1 }
    });

/* Form in a table means form in that table: the club's last five games in
   this competition and this phase, not whatever it played last anywhere (a
   Promé table used to show a club's Kopa results). A game belongs to the phase
   when it carries that phase, or failing that, when both clubs are in it. */
function phaseForm(divId,g,cid,rows){
  var n=function(x){ return String(x||"").toLowerCase().replace(/[^a-z0-9]/g,"") };
  var gn=n(groupName(divId,g)), gk=n(g);
  var inT={}; (rows||[]).forEach(function(r){ inT[r[1]]=1 });
  var mine=DATA.matches.filter(function(m){ return m.div===divId && m.status==="ft" && (m.home===cid||m.away===cid) });
  var tagged=mine.filter(function(m){
    var ph=n(m.phase);

  });

    .slice(-5);

/* What somebody follows belongs to the account, not to the handset. On this
   phone it is saved straight away, and on the account a moment later. */
var prefsT=null, prefsPulled=false;
function prefsPush(){
  if(!API || !FANU) return;
  clearTimeout(prefsT);
  prefsT=setTimeout(function(){
    api("/me/prefs",{method:"POST",fan:true,body:{
      clubs:FAN.clubs, players:FAN.players, primary:FAN.primary||"",
      matches:Object.keys(FANM||{}), notif:NOTIF
    }}).catch(function(){});
  },900);
}
/* Signing in on a fresh phone should bring your clubs with you. Anything set up
   here before signing in is not thrown away: it is sent up instead. */
function prefsPull(){
  if(!API || !FANU || prefsPulled) return;
  prefsPulled=true;
  api("/me/prefs",{fan:true}).then(function(j){
    var pr=j && j.prefs;
    var haveLocal=(FAN.clubs&&FAN.clubs.length)||(FAN.players&&FAN.players.length);
    if(!pr || (!(pr.clubs||[]).length && !(pr.players||[]).length)){
      if(haveLocal) prefsPush();
      return;
    }
    if(!haveLocal){
      FAN.clubs=(pr.clubs||[]).slice();
      FAN.players=(pr.players||[]).slice();
      FAN.primary=pr.primary||FAN.clubs[0]||"";
      FAN.onboard=true;
      lsSet("kf.fan",FAN);
      if(pr.matches){ FANM={}; pr.matches.forEach(function(id){ FANM[id]=1 }); lsSet("kf.fanm",FANM) }
      if(pr.notif){ NOTIF=Object.assign(NOTIF,pr.notif); notifSave() }
      render();
    } else prefsPush();
  }).catch(function(){});
}

  R.page=h[0]||"home"; R.arg=h[1]||""; R.sub=h[2]||"";

/* Road to the final, for a cup whose group winners meet in a final (the
   women's Kopa). Everything is worked out from the fixtures: a club is through
   once nobody else in its group can still reach its points, out once it can no
   longer reach the leader's, and in the race otherwise. Level on points is left
   as "in the race" on purpose, since the table splits ties on goals. */
function groupRace(divId, g){
  var ms=matchesOf(divId).filter(function(m){return m.group===g});
  var t={};
  ms.forEach(function(m){ [m.home,m.away].forEach(function(c){ if(!t[c]) t[c]={id:c,pts:0,gd:0,gf:0,left:0,next:null} }) });
  ms.forEach(function(m){
    var h=t[m.home], a=t[m.away];
    if(m.status==="ft"){
      h.gf+=m.hs; a.gf+=m.as; h.gd+=m.hs-m.as; a.gd+=m.as-m.hs;
      if(m.hs>m.as) h.pts+=3; else if(m.hs<m.as) a.pts+=3; else { h.pts++; a.pts++ }
    } else {
      h.left++; a.left++;
      [[h,m.away],[a,m.home]].forEach(function(x){
        if(!x[0].next || (m.date+m.time)<(x[0].next.date+x[0].next.time)) x[0].next={date:m.date,time:m.time,opp:x[1]};
      });
    }
  });
  var list=Object.keys(t).map(function(k){ var r=t[k]; r.max=r.pts+3*r.left; return r });
  list.sort(function(x,y){ return y.pts-x.pts || y.gd-x.gd || y.gf-x.gf || club(x.id).short.localeCompare(club(y.id).short) });
  var done=list.length && list.every(function(r){return r.left===0});
  list.forEach(function(r,i){
    var others=list.filter(function(o){return o!==r});
    if(done) r.state = i===0 ? "through" : "out";
    else if(others.every(function(o){return o.max<r.pts})) r.state="through";
    else if(others.some(function(o){return o.pts>r.max})) r.state="out";
    else r.state="race";
  });
  var winner=list.filter(function(r){return r.state==="through"})[0]||null;
  var top=list.filter(function(r){return list.length && r.pts===list[0].pts && r.state!=="out"});
  return {list:list, winner:winner, top:top, played:ms.some(finished)};
}
function roadToFinal(divId){

  var h='<div class="card" style="margin-bottom:12px;padding:14px 16px">';

  h+='<p class="muted" style="font-size:12.5px;margin:0 0 12px">'+esc(pa
    ? "Dos grupo. Kada ekipo ta hunga un biaha kontra kada otro ekipo den su grupo. E dos ganadónan di grupo ta topa otro den final. Den nos tabel, ekiponan igual na punto ta wòrdu separá pa diferensia di gol, despues pa gol skor."
    : "Two groups. Every team plays each other team in its group once. The two group winners meet in the final. In our table, teams level on points are split by goal difference, then goals scored.")+'</p>';
  h+='<div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line,rgba(127,127,127,.2));border-bottom:1px solid var(--line,rgba(127,127,127,.2))">'+
     side(races[0])+'<div style="font-weight:800;opacity:.6">VS</div>'+side(races[1])+'</div>';
  h+='<div class="grid g2" style="margin-top:12px">'+races.map(function(g){
    return '<div><div style="font-weight:800;font-size:13px;margin-bottom:6px">'+esc(g.name)+'</div>'+g.r.list.map(function(x){
      var nx=x.next?((pa?"Siguiente: ":"Next: ")+(pa?"kontra ":"v ")+club(x.next.opp).short+" · "+fmtDate(x.next.date,true)+(x.next.time?" "+x.next.time:"")):(pa?"Tur wega hugá":"All games played");
      return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0">'+crest(x.id,"sm")+

/* Open fixtures: dates on the calendar whose teams are not known yet (a semi
   final, a final). data.openties lists them; each side says where its team
   comes from: {from: match id or open fixture id} for a winner, {group: "A"}
   for a group winner. Sides fill in by themselves as results come in, and the
   whole fixture steps aside the moment a real match for it is in the data. */
function otById(id){ return (DATA.openties||[]).filter(function(o){return o.id===id})[0]||null }
function otReal(o){
  var sides=[otSide(o,o.home,1), otSide(o,o.away,1)], ids=sides.map(function(x){return x.id}).filter(Boolean);
  return DATA.matches.filter(function(m){
    if(m.div!==o.div) return false;
    if(ids.length) return (m.date===o.date && (ids.indexOf(m.home)>=0||ids.indexOf(m.away)>=0)) ||
                          (ids.length===2 && ids.indexOf(m.home)>=0 && ids.indexOf(m.away)>=0 && m.date>=o.date);
    return m.date===o.date && !m.own;
  })[0]||null;
}
function otSide(o,side,depth){
  var pa=LANG==="pa", win=pa?"Ganadó ":"Winner ";
  side=side||{};
  if(side.group){
    var r=groupRace(o.div,side.group);
    return r.winner ? {id:r.winner.id,label:""} : {id:"",label:win+groupName(o.div,side.group)};
  }
  if(side.from){
    var m=DATA.matches.filter(function(x){return x.id===side.from})[0];
    if(m){ var w=koWinner(m); return w?{id:w,label:""}:{id:"",label:win+(club(m.home).abbr||"?")+"/"+(club(m.away).abbr||"?")} }
    var ot=otById(side.from);
    if(ot){
      var real=(depth||0)<3 ? otReal(ot) : null;
      if(real){ var w2=koWinner(real); if(w2) return {id:w2,label:""};
        return {id:"",label:win+(club(real.home).abbr||"?")+"/"+(club(real.away).abbr||"?")} }
      return {id:"",label:win+(pa?(ot.nameP||ot.name):ot.name).toLowerCase()};
    }
  }
  return {id:"",label:pa?"Pa disidí":"To be decided"};
}
function openTies(divId,date){
  return (DATA.openties||[]).filter(function(o){
    return (!divId||o.div===divId) && (!date||o.date===date) && !otReal(o);
  }).sort(function(a,b){ return (a.date+(a.time||"")).localeCompare(b.date+(b.time||"")) });
}
function openRow(o,showDate){
  var pa=LANG==="pa";
  var side=function(sd){
    var x=otSide(o,sd,0);
    if(x.id) return '<span class="mteam">'+crest(x.id)+'<span class="nm">'+esc(club(x.id).short)+'</span></span>';
    return '<span class="mteam"><span class="crest" style="background:transparent;border:1.5px dashed var(--muted,#8b9099)" aria-hidden="true"></span><span class="nm" style="opacity:.75">'+esc(x.label)+'</span></span>';
  };
  return '<div class="mrow" style="cursor:default">'+
    '<span class="when">'+(showDate?esc(fmtDate(o.date,true))+'<br>':'')+esc(o.time||"")+'</span>'+
    '<span class="teams">'+side(o.home)+side(o.away)+'</span>'+
    '<span class="stat"><span class="pill">'+esc(pa?"Pa disidí":"TBD")+'</span><span class="eyebrow">'+esc(divOf(o.div).short)+' · '+esc(pa?(o.nameP||o.name):o.name)+(o.venue?' · '+esc(o.venue):'')+'</span></span>'+
    '<span class="chev"></span></div>';
}
function matchDays(divId){
  var o={};
  matchesOf(divId).forEach(function(m){
    o[m.date]=o[m.date]||{n:0,live:0,mds:{}};
    o[m.date].n++; o[m.date].mds[m.md]=1;
    if(m.status==="live") o[m.date].live++;
  });
  openTies(divId).forEach(function(t){
    o[t.date]=o[t.date]||{n:0,live:0,mds:{}};
    o[t.date].n++;
  });
  return Object.keys(o).sort().map(function(d){
    return {date:d,n:o[d].n,live:o[d].live,mds:Object.keys(o[d].mds)};
  });
}
function pickDay(days,want){
  if(!days.length) return "";
  for(var i=0;i<days.length;i++) if(days[i].date===want) return want;
  for(var j=0;j<days.length;j++) if(days[j].live) return days[j].date;
  var t=today();
  for(var k=0;k<days.length;k++) if(days[k].date>=t) return days[k].date;
  return days[days.length-1].date;
}
function dateRail(days,cur,attr){

    '<div class="daterail">'+days.map(function(d){

      return '<button class="daychip'+(d.live?" hasLive":"")+(d.date===t?" isToday":"")+'" '+attr+'="'+d.date+'" aria-pressed="'+(d.date===cur)+'">'+
        '<span class="dow">'+esc((LANG==="pa"?DAY_PA:DAY_EN)[dt.getDay()])+'</span>'+
        '<span class="dnum">'+dt.getDate()+'</span>'+
        '<span class="dmon">'+esc((LANG==="pa"?MONTH_PA:MONTH_EN)[dt.getMonth()])+'</span>'+
        '<span class="dcount">'+(d.live?d.live:d.n)+'</span></button>';
    }).join("")+'</div>'+

      '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>'+
  '</div></div>'+adFor("matches");
}

function mFilterRail(counts){

function viewMatches(){
  var scope = allComps ? "" : R.div;
  var days=matchDays(scope);

  var cur=pickDay(days,R.arg);
  var day=days.filter(function(d){return d.date===cur})[0]||days[0];
  var all=matchesOf(scope).filter(function(m){return m.date===cur})
    .sort(function(a,b){return (a.time||"").localeCompare(b.time||"")||a.id.localeCompare(b.id)});
  var counts={all:all.length,
    live:all.filter(function(m){return m.status==="live"}).length,
    ft:all.filter(function(m){return m.status==="ft"}).length,

      '<div class="stat-t"><div class="k">'+esc(T("totalGoals"))+'</div><div class="v">'+goals+'</div></div>'+

    '</div></div>';
  h+='<div class="swipehint">'+esc(LANG==="pa"?"Bai zoya pa otro dia":"Swipe for another day")+'</div>';
  h+='</div>';
  return h;
