var refMatches = null, refOpen = "";
/* Apply what the server just told us, rather than asking it again.
   One less round trip, and it still works on a bad connection at the pitch. */
function refApply(mid, patch){
  if(!refMatches) return;
  var m = refMatches.filter(function(x){ return x.id === mid })[0];
  if(!m){
    /* A fixture we typed in ourselves, which the server has not put in our
       appointment list yet. Adopt it so the panel keeps up as we tap. */
    var o = (DATA.ownmatches||[]).filter(function(x){ return x.id === mid })[0] ||
            (serverAdmin() ? DATA.matches.filter(function(x){ return x.id === mid })[0] : null);
    if(!o) return;
    m = { id:o.id, date:o.date, time:o.time||"", div:o.div, home:o.home, away:o.away,
          venue:o.venue||"", feedStatus:"sched", state:null, own:true };
    refMatches.push(m);
  }
  m.state = Object.assign({ status:"sched", minute:0, hs:0, as:0, confirmed:false }, m.state || {}, patch || {});
}


/* Yesterday, in Curacao. The referee keeps a grace day to close a late match. */
function yday(){ return new Date(Date.now()+TZ_OFFSET_MS-86400000).toISOString().slice(0,10) }

/* What the console shows. The server's own list is the source of truth for
   appointments, and a fixture put in by hand is added on top of it, so a game
   typed in an hour ago is there even if the server has not re-read the fixture
   file yet. Today first, then yesterday, and anything already closed goes to the
   bottom so you never open a finished game by mistake. */
function refList(){
  var list=(refMatches||[]).slice(), have={};
  list.forEach(function(x){ have[x.id]=1 });
  var t=today(), y=yday();
  (DATA.ownmatches||[]).forEach(function(o){
    if(!o || !o.id || have[o.id]) return;
    if(o.date!==t && o.date!==y) return;
    list.push({ id:o.id, date:o.date, time:o.time||"", div:o.div, home:o.home, away:o.away,
                venue:o.venue||"", feedStatus:"sched", state:null, own:true });
    have[o.id]=1;
  });
  /* The admin scores any game, not only the ones he is appointed to: the last
     week, today and tomorrow, including the fixtures typed in by hand. The
     server already lets an admin act on any match. */
  if(serverAdmin()){
    var from=new Date(Date.now()+TZ_OFFSET_MS-7*86400000).toISOString().slice(0,10);
    var to=new Date(Date.now()+TZ_OFFSET_MS+86400000).toISOString().slice(0,10);
    DATA.matches.forEach(function(m){
      if(!m || have[m.id] || m.ffkFinal || !m.date || m.date<from || m.date>to) return;
      list.push({ id:m.id, date:m.date, time:m.time||"", div:m.div, home:m.home, away:m.away,
                  venue:m.venue||"", feedStatus:m.ours?"ft":"sched",
                  state:m.ours?{status:"ft",hs:m.hs,as:m.as,minute:0,confirmed:true}:null,
                  own:!!m.own, extra:true });
      have[m.id]=1;
    });
  }
  var done=function(x){ return (x.state&&x.state.confirmed) || x.feedStatus==="ft" ? 1 : 0 };
  var ahead=function(x){ return String(x.date)>t ? 1 : 0 };
  list.sort(function(a,b){
    return done(a)-done(b) || ahead(a)-ahead(b) ||
           (ahead(a) ? String(a.date).localeCompare(String(b.date)) : String(b.date).localeCompare(String(a.date))) ||
           String(a.time).localeCompare(String(b.time));
  });
  return list;
}

function viewRef(){
  if(!API) return '<div class="card"><div class="empty"><h3>'+esc(T("refConsole"))+'</h3><p>'+

    esc(LANG==="pa"?"ta warda señal":"waiting for signal")+'</span></div>';

  h += myPointsPanel();
  if(refMatches === null){
    api("/ref/me", { auth: true }).then(function(j){
      refMatches = j.matches || []; render();
    }).catch(function(e){
      if(e.status === 401){ REF = null; lsSet("kf.ref", null) }
      refMatches = []; render();
    });

  }
  var RL = refList();

    + rewardsPanel();

  /* Never open a game by itself unless it is the only one left to do. */
  var todo = RL.filter(function(x){ return !((x.state&&x.state.confirmed) || x.feedStatus==="ft") });
  var m = RL.filter(function(x){ return x.id === refOpen })[0] || (todo.length === 1 ? todo[0] : null);
  if(!m){
    h += '<div class="card">' + RL.map(function(x){
      var shut = (x.state&&x.state.confirmed) || x.feedStatus==="ft";
      var when = x.date===today() ? T("today") : fmtDate(x.date,true);
      var tag = shut ? '<span class="pill ft">'+esc(T("ft"))+'</span>'
              : (x.state && (x.state.status==="live"||x.state.status==="ht")
                  ? '<span class="pill live">'+esc(T("live"))+'</span>' : "");
      return '<button class="lb" data-act="refopen" data-m="'+esc(x.id)+'"'+
        (shut?' style="opacity:.55"':'')+'><span class="rk">'+esc(x.time||"")+'</span>'+
        '<span class="who"><b>'+esc(club(x.home).short)+' v '+esc(club(x.away).short)+'</b>'+
        '<small>'+esc(when)+(x.venue?" · "+esc(x.venue):"")+'</small></span>'+
        tag+'<span class="chev">›</span></button>';
    }).join("") + '</div>';
    return h;
  }
  return h + refPanel(m) + rewardsPanel();
}

function refPanel(m){
  var st = m.state || { status:"sched", hs:0, as:0, minute:0, confirmed:false };
  var live = st.status === "live" || st.status === "ht";
  var atHT = st.status === "ht";
  var done = !!st.confirmed;
  var H = club(m.home), A = club(m.away);

  var h = '<div class="card" style="padding:14px">'+
    '<div class="eyebrow">'+esc(fmtDate(m.date,true))+' · '+esc(m.time||"")+' · '+esc(m.venue||"")+'</div>'+
    '<div class="refscore">'+
      '<span style="text-align:right;flex:1"><b style="display:block;font-size:14px">'+esc(H.short)+'</b><span class="n">'+st.hs+'</span></span>'+
      '<span class="vs">'+(live?(atHT?"HT":'<span class="livedot"></span>'+clockSpan(m.id)):(done?esc(T("ft")):"v"))+'</span>'+
      '<span style="text-align:left;flex:1"><b style="display:block;font-size:14px">'+esc(A.short)+'</b><span class="n">'+st.as+'</span></span>'+

  h += '</div>';

  if(done){
    /* A referee cannot undo his own result, that is the point of confirming it.
       The admin can, because somebody has to be able to fix a mistake. */
    if(serverAdmin()) return h + '<div class="card" style="padding:14px;margin-top:12px">'+
      '<div class="eyebrow">'+esc(LANG==="pa"?"Korigí e resultado":"Correct the score")+'</div>'+

        '<div class="field"><label>'+esc(club(m.home).short)+'</label>'+

        '<div class="field"><label>'+esc(club(m.away).short)+'</label>'+

      '</div>'+
      '<div class="btnrow"><button class="btn" data-act="fixscore" data-m="'+esc(m.id)+'">'+esc(T("save"))+'</button></div></div>';

    return h + '<div class="card" style="margin-top:12px"><div class="empty"><h3>'+
      esc(LANG==="pa"?"Konfirmá":"Confirmed")+'</h3><p>'+
      esc(LANG==="pa"?"E resultado ta ofisial. Pa un koreshon, papia ku e admin.":"This result is official. For a correction, speak to the admin.")+'</p></div></div>';
  }

  /* A game from an earlier day that nobody scored live: the admin can put the
     final score straight in instead of playing the match through the clock. */
  if(!live && serverAdmin() && m.date < today()){
    h += '<div class="card" style="padding:14px;margin:12px 0">'+
      '<div class="eyebrow">'+esc(LANG==="pa"?"Pone e resultado final":"Enter the final score")+'</div>'+
      '<p class="muted" style="font-size:13px;margin:8px 0">'+
      esc(LANG==="pa"?"Pa un partido ku a wòrdu hunga kaba. E tabel ta kalkulá su mes.":"For a game already played. The table works itself out.")+'</p>'+
      '<div class="frow">'+
        '<div class="field"><label>'+esc(club(m.home).short)+'</label><input id="fixhs" type="number" min="0" max="30" value="0"></div>'+
        '<div class="field"><label>'+esc(club(m.away).short)+'</label><input id="fixas" type="number" min="0" max="30" value="0"></div>'+
      '</div>'+
      '<div class="btnrow"><button class="btn" data-act="fixscore" data-m="'+esc(m.id)+'">'+esc(T("save"))+'</button></div></div>';
  }
  if(!live){
    h += '<div class="reftap" style="grid-template-columns:1fr">'+

      '<small>'+esc(LANG==="pa"?"Primi un biaha. E minüt ta kore su mes.":"Press once. The minute runs on its own.")+'</small></button></div>';

      '<button class="btn ghost sm" data-act="reflineup" data-m="'+esc(m.id)+'" data-team="'+esc(m.home)+'">'+esc(club(m.home).abbr)+' XI</button>'+
      '<button class="btn ghost sm" data-act="reflineup" data-m="'+esc(m.id)+'" data-team="'+esc(m.away)+'">'+esc(club(m.away).abbr)+' XI</button>'+

        esc(LANG==="pa"?"Posponé":"Postponed")+'</button>'+
      '</div>';
    return h;
  }

  /* Half time: the clock is parked on 45 and the viewers see HT. The only thing
     to do here is blow the second half whistle. */

      '<small>'+esc(LANG==="pa"?"Despues di esaki bo no por kambia mas":"After this you cannot change it")+'</small></button></div>';

  '</div>';

  h += '<div class="btnrow" style="margin:4px 0 12px;flex-wrap:wrap">'+
    '<button class="btn ghost sm" data-act="refht" data-m="'+esc(m.id)+'">'+esc(LANG==="pa"?"Mitar tempo (HT)":"Half time (HT)")+'</button>'+

    '<small>'+esc(LANG==="pa"?"Despues di esaki bo no por kambia mas":"After this you cannot change it")+'</small></button></div>';

    '</div>';
  return h;
}


var refEvents = {};
function refEventList(m){
  var evs = refEvents[m.id];
  if(evs === undefined || evs === null){
    refEvents[m.id] = [];
    api("/live").then(function(j){
      applyLive(j);
      var f = LIVE.byId[m.id];
      refEvents[m.id] = (f && f.events) || [];
      render();
    }).catch(function(){});
  }
  evs = refEvents[m.id] || [];
  if(!evs.length) return '<div class="card"><div class="empty" style="padding:16px"><p>'+
    esc(LANG==="pa"?"Ainda nada. Primi un bòter ariba ora algu pasa.":"Nothing yet. Press a button above when something happens.")+'</p></div></div>';

/* The fan ladder. 3 points for the exact score, 1 for the right outcome.

  var head='<div class="sechead"><h2 style="font-size:15px">'+
    esc(LANG==="pa"?"Klasifikashon di fan":"Fan leaderboard")+'</h2></div>';
  if(LB===null){

    api("/leaderboard?limit=25",{fan:true}).then(function(j){ LB=j||{rows:[]}; render() })
      .catch(function(){ LB={rows:[],me:null}; render() });
    /* Show the section straight away rather than popping it in a moment later. */
    return head+'<div class="card"><div class="empty" style="padding:18px"><p class="muted">'+
      esc(LANG==="pa"?"Ta karga...":"Loading...")+'</p></div></div>';
  }
  if(LB==="loading") return head+'<div class="card"><div class="empty" style="padding:18px"><p class="muted">'+
    esc(LANG==="pa"?"Ta karga...":"Loading...")+'</p></div></div>';
  var rows = (LB && Array.isArray(LB.rows)) ? LB.rows : [];
  var me = LB && LB.me;
  var h='<div class="sechead"><h2 style="font-size:15px">'+esc(LANG==="pa"?"Klasifikashon di fan":"Fan leaderboard")+'</h2>'+
        '<span class="sub">'+esc(LANG==="pa"?"Temporada":"Season")+' '+esc(DATA.season||"")+'</span>'+
        (FANU?'<button class="more" data-act="fanout">'+esc(LANG==="pa"?"Sali":"Sign out")+'</button>':'')+'</div>';

  if(!FANU){
    h+='<div class="card" style="padding:16px">'+
      '<p class="muted" style="margin:0 0 10px;font-size:13px">'+
        esc(LANG==="pa"?"Skohe un nòmber pa drenta e klasifikashon. Bo pronóstiko ta konta for di e momento ei."
                       :"Pick a name to join the ladder. Your predictions count from then on.")+'</p>'+
      '<div class="field"><label>'+esc(LANG==="pa"?"Bo nòmber":"Your name")+'</label>'+
        '<input id="fanname" maxlength="28" autocomplete="off"></div>'+
      '<div class="btnrow"><button class="btn" data-act="fanjoin">'+esc(LANG==="pa"?"Drenta":"Join")+'</button></div>'+
      (gClientId()
        ? '<div style="display:flex;align-items:center;gap:10px;margin:14px 0 10px">'+
            '<span style="flex:1;height:1px;background:var(--line)"></span>'+
            '<span class="muted" style="font-size:11.5px">'+esc(LANG==="pa"?"òf":"or")+'</span>'+
            '<span style="flex:1;height:1px;background:var(--line)"></span></div>'+
          '<div id="gbtn"></div>'
        : '')+
      '</div>';
  }

  if(!rows.length){
    h+='<div class="card"><div class="empty" style="padding:20px"><h3>'+
      esc(LANG==="pa"?"E tabel ta bashí ainda":"The table is still empty")+'</h3><p>'+
      esc(LANG==="pa"?"Ora e promé partido kaba, e punto ta drenta aki mesora."
                     :"As soon as the first match is finished, the points land here.")+'</p></div></div>';
  } else {
    h+='<div class="card">'+rows.map(function(r,i){
      var rank=i+1, mine=!!(FANU && r.name===FANU.name);
      return '<div class="lb"'+(mine?' style="background:var(--accent-soft)"':'')+'>'+
        '<span class="rk'+(rank<=3?' top':'')+'">'+rank+'</span>'+
        '<span class="who"><b>'+esc(r.name)+(mine?' <span class="pill acc">'+esc(LANG==="pa"?"bo":"you")+'</span>':'')+'</b>'+
          '<small>'+(r.exact||0)+' '+esc(LANG==="pa"?"eksakto":"exact")+' · '+(r.played||0)+' '+esc(LANG==="pa"?"partido":"played")+'</small></span>'+
        '<span class="big">'+(r.pts||0)+'</span></div>';
    }).join("")+'</div>';
  }

  /* Always show the signed in fan their own line, even on nought, so joining
     visibly does something before the first result lands. */
  var inTop = FANU && rows.some(function(r){ return r.name===FANU.name });

/* Counting, for the advertisers. A random id per phone, kept on the phone, and
   nothing else: no name, no location, no third party, no cookie. Events are
   batched and sent at most every 20 seconds, and a failure is ignored. */
var TRK = { q: [], at: 0, dev: null };
function trkDev(){
  if(TRK.dev) return TRK.dev;
  var d = lsGet("kf.dev","");
  if(!d){
    d = "d" + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-5);
    lsSet("kf.dev", d);
  }
  TRK.dev = d;
  return d;
}
function track(kind, key){
  if(!API) return;
  TRK.q.push({k:kind, v:key||""});
  if(TRK.q.length > 60) TRK.q.splice(0, TRK.q.length-60);
  trkFlush(false);
}
function trkFlush(force){
  if(!API || !TRK.q.length) return;
  var now = Date.now();
  if(!force && now - TRK.at < 20000) return;
  TRK.at = now;
  var batch = TRK.q.splice(0, TRK.q.length);
  api("/t",{method:"POST",body:{dev:trkDev(), e:batch}}).catch(function(){});
}
document.addEventListener("visibilitychange",function(){ if(document.hidden) trkFlush(true) });
window.addEventListener("pagehide",function(){ trkFlush(true) });
setInterval(function(){ trkFlush(false) }, 20000);

/* Google sign in. The script only loads once a client id has been published, so
   an app without one carries no third party code at all. The button is drawn
   after each render because the view is rewritten wholesale. */
var GSI = { asked:false, ready:false };
function gClientId(){ return (DATA.googleClientId||"").trim() }
function gLoad(){
  if(GSI.asked || !gClientId() || !API) return;
  GSI.asked = true;
  var s = document.createElement("script");
  s.src = "https://accounts.google.com/gsi/client";
  s.async = true; s.defer = true;
  s.onload = function(){
    try{
      window.google.accounts.id.initialize({
        client_id: gClientId(),
        callback: function(res){ gSignIn(res && res.credential) }
      });
      GSI.ready = true;
      gPaint();
    }catch(e){}
  };
  s.onerror = function(){ GSI.ready = false };
  document.head.appendChild(s);
}
function gPaint(){
  if(!GSI.ready) return;
  var el = document.getElementById("gbtn");
  if(!el || el.getAttribute("data-painted")) return;
  try{
    window.google.accounts.id.renderButton(el, {
      theme: (document.documentElement.getAttribute("data-theme")==="light" ? "outline" : "filled_black"),
      size: "large", shape: "pill", text: "signin_with", width: 260
    });
    el.setAttribute("data-painted","1");
  }catch(e){}
}
function gSignIn(cred){
  if(!cred) return;
  api("/auth/google",{method:"POST",body:{credential:cred}}).then(function(j){
    FANU={token:j.token,id:j.user.id,name:j.user.name,pic:j.user.pic||"",via:j.user.via||"google"};
    lsSet("kf.fanacct",FANU); LB=null; prefsPulled=false; pushPreds(); prefsPull();
    toast(T("welcome")); closeModal(); render();
    if(!FAN.onboard) setTimeout(function(){ if(!FAN.clubs.length) openPicker() },500);
  }).catch(function(e){ toast(e.message) });
}

}

var formCtx=null;
function openForm(title,fields,values,onSave,onDelete){
  formCtx={fields:fields,values:Object.assign({},values),onSave:onSave};
  var body=fields.map(function(f){
    var v=values[f.k]==null?"":values[f.k];
    var input;
    if(f.type==="select"){
      input='<select data-fk="'+f.k+'">'+f.options.map(function(o){
        return '<option value="'+esc(o[0])+'"'+(String(v)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>';
      }).join("")+'</select>';
    } else if(f.type==="textarea"){
      input='<textarea data-fk="'+f.k+'">'+esc(v)+'</textarea>';
    } else if(f.type==="image"){
      input='<div class="imgfield"><input type="hidden" data-fk="'+f.k+'" value="'+esc(v)+'">'+
        '<div class="imgprev"'+(v?'':' hidden')+'><img src="'+esc(v)+'" alt=""></div>'+
        '<input type="file" accept="image/*" data-imgfor="'+f.k+'">'+
        (v?'<button type="button" class="btn ghost sm" data-act="clrimg" data-k="'+f.k+'">'+esc(LANG==="pa"?"Kita imagen":"Remove image")+'</button>':'')+
        '</div>';
    } else if(f.type==="check"){
      input='<label style="display:flex;gap:8px;align-items:center;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink)"><input type="checkbox" data-fk="'+f.k+'" style="width:auto"'+(v?' checked':'')+'> '+esc(f.hint||"")+'</label>';
    } else {
      input='<input data-fk="'+f.k+'" type="'+(f.type||"text")+'" value="'+esc(v)+'"'+(f.type==="number"?' step="any"':'')+'>';
    }
    return '<div class="field"><label>'+esc(f.label)+'</label>'+input+
      (f.hint && f.type!=="check" ? '<span class="muted" style="font-size:11.5px">'+esc(f.hint)+'</span>' : '')+'</div>';
  }).join("");
  var foot='<button class="btn" data-act="formsave">'+esc(T("save"))+'</button><button class="btn ghost" data-act="closemodal">'+esc(T("cancel"))+'</button>'+
    (onDelete?'<button class="btn danger" data-act="formdel" style="margin-left:auto">'+esc(T("del"))+'</button>':'');
  formCtx.onDelete=onDelete;
  openModal(title,body,foot);
}
function readForm(){

    m[k]= (e.type==="number")? (+e.value||0) : e.value;
  });
  m.officials=m.officials||{ref:"",ar1:"",ar2:"",fourth:""};
  Array.prototype.forEach.call(document.querySelectorAll("[data-mo]"),function(e){ m.officials[e.getAttribute("data-mo")]=e.value });
  Array.prototype.forEach.call(document.querySelectorAll("[data-mb]"),function(e){ m[e.getAttribute("data-mb")]=e.checked });
  m.respect=m.respect||{home:0,away:0};
  Array.prototype.forEach.call(document.querySelectorAll("[data-mr]"),function(e){ m.respect[e.getAttribute("data-mr")]=Math.max(0,Math.min(5,+e.value||0)) });
  m.sample=false;
  if(m.status==="ft"||m.status==="live"){} else { m.hs=m.hs||0; m.as=m.as||0 }
  mark();
}

/* ───────── publish ───────── */
function dl(filename,text,mime){
  try{
    var b=new Blob([text],{type:mime||"text/plain;charset=utf-8"});
    var u=URL.createObjectURL(b), a=document.createElement("a");
    a.href=u; a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove() },1500);
    return true;
  }catch(e){ return false }
}
function toast(msg){
  var t=el("div","toast",esc(msg)); document.body.appendChild(t);
  setTimeout(function(){ t.remove() },2600);
}
function buildHTML(){
  if(!TEMPLATE) return null;
  var json=JSON.stringify(DATA).replace(/</g,"\\u003c");
  var re=/(<script id="app-data" type="application\/json">)[\s\S]*?(<\/script>)/;
  if(!re.test(TEMPLATE)) return null;
  return TEMPLATE.replace(re,function(_,a,b){ return a+json+b });
}
function doPublish(btn){
  DATA.updated=today();
  lsSet("kf.data",DATA);
  if(API && REF && REF.role==="admin"){
    if(btn) btn.disabled=true;
    publishContent().then(function(r){
      dirty=false;
      toast(LANG==="pa"?("Publiká pa tur hende ("+Math.round(r.bytes/1024)+" KB)")
                       :("Published to everyone ("+Math.round(r.bytes/1024)+" KB)"));
      render();
    }).catch(function(e){
      if(btn) btn.disabled=false;
      toast((LANG==="pa"?"No a logra publiká: ":"Could not publish: ")+e.message);
    });
    return;
  }
  var html=buildHTML();
  if(html && dl("index.html",html,"text/html;charset=utf-8")){
    dirty=false;
    toast(LANG==="pa"?"Wardá riba e telefon + index.html bahá":"Saved on this phone + index.html downloaded");
  } else {
    dirty=false;
    toast(LANG==="pa"?"Wardá riba e telefon":"Saved on this phone");
  }
  render();
}

function nextMatchFor(id){
  return DATA.matches.filter(function(m){return (m.home===id||m.away===id)&&m.status!=="ft"})
    .sort(function(a,b){return a.date.localeCompare(b.date)||(a.time||"").localeCompare(b.time||"")})[0];
}
function lastMatchFor(id){
  return DATA.matches.filter(function(m){return (m.home===id||m.away===id)&&m.status==="ft"})
    .sort(function(a,b){return b.date.localeCompare(a.date)})[0];
}
function countdown(m){
  if(!m) return "";
  if(m.status==="live") return m.ht ? "HT" : minuteLabel(clockSrc(m.id));
  var p=m.date.split("-"), tt=(m.time||"00:00").split(":");
  var when=new Date(+p[0],+p[1]-1,+p[2],+tt[0]||0,+tt[1]||0);
  var diff=when-new Date();
  if(diff<=0) return T("today");
  var d=Math.floor(diff/86400000), h=Math.floor(diff%86400000/3600000);
  return d? (d+" "+T("days")+(h?" "+h+" "+T("hours"):"")) : (h+" "+T("hours"));
}

function refById(id){ var r=DATA.referees.filter(function(x){return x.id===id})[0]; return r||null }
function refName(id){ var r=refById(id); return r?r.name:"" }
function levelOf(n){ var lv=(DATA.refrules.levels[0]||["bronze",0])[0]; DATA.refrules.levels.forEach(function(x){ if(n>=x[1]) lv=x[0] }); return lv }
function nextLevel(n){
  var out=null; DATA.refrules.levels.forEach(function(x){ if(!out && n<x[1]) out={name:x[0],at:x[1]} });
  return out;
}
function initials(n){ return String(n||"").trim().split(/\s+/).map(function(w){return w[0]}).slice(0,2).join("").toUpperCase() }
function refStats(){
  var R2=DATA.refrules, out={};
  DATA.referees.forEach(function(r){ out[r.id]={id:r.id,m:0,earned:0,spent:0,ref:0,ar:0,fourth:0,last:"",short:0} });
  var RSTART=DATA.refstart||"";
  DATA.matches.forEach(function(m){
    if(m.status!=="ft") return;
    if(RSTART&&m.date<RSTART) return;
    var o=m.officials||{}, w=R2.div[m.div]||16;
    [["ref",o.ref],["ar",o.ar1],["ar",o.ar2],["fourth",o.fourth]].forEach(function(x){
      var role=x[0], id=x[1]; if(!id||!out[id]) return;
      var pts=w*(R2.role[role]||0);
      if(m.shortNotice){ pts*=(1+(R2.shortNotice||0)); out[id].short++ }
      if(m.reportFiled&&role==="ref") pts+=(R2.report||0);
      out[id].earned+=Math.round(pts); out[id].m++; out[id][role]++;
      if(m.date>out[id].last) out[id].last=m.date;
    });
  });
  (DATA.refledger||[]).forEach(function(l){
    if(!out[l.refId]) return;
    if(l.points<0) out[l.refId].spent+=-l.points; else out[l.refId].earned+=l.points;
  });
  Object.keys(out).forEach(function(k){
    out[k].bal=out[k].earned-out[k].spent;
    out[k].level=levelOf(out[k].m);
  });
  return out;
}
function missingOfficials(m){
  var o=m.officials||{}, need=[];
  if(!o.ref) need.push("ref");
  if(!o.ar1) need.push("ar");
  if(!o.ar2) need.push("ar");
  return need;
}
function respectTable(divId){
  var rows={};
  DATA.clubs.filter(function(c){return !divId||c.div===divId}).forEach(function(c){ rows[c.id]={id:c.id,sum:0,n:0} });
  DATA.matches.forEach(function(m){
    if(m.status!=="ft"||!m.respect) return;
    if(rows[m.home]&&m.respect.home){ rows[m.home].sum+=m.respect.home; rows[m.home].n++ }
    if(rows[m.away]&&m.respect.away){ rows[m.away].sum+=m.respect.away; rows[m.away].n++ }
  });
  return Object.keys(rows).map(function(k){var r=rows[k];r.avg=r.n?r.sum/r.n:0;return r})
    .filter(function(r){return r.n}).sort(function(a,b){return b.avg-a.avg});
}
function refOfMonth(st){
  var cut=(function(){var d=new Date(today());d.setDate(d.getDate()-30);return d.toISOString().slice(0,10)})();
  var sc={};
  DATA.matches.forEach(function(m){
    if(m.status!=="ft"||m.date<cut) return;
    var o=m.officials||{}; if(o.ref) sc[o.ref]=(sc[o.ref]||0)+1;
  });
  var best="",n=0;
  Object.keys(sc).forEach(function(k){ if(sc[k]>n||(sc[k]===n&&st[k]&&st[best]&&st[k].earned>st[best].earned)){best=k;n=sc[k]} });
  return best?{id:best,n:n}:null;
}
function stars5(v){
  var out='';
  for(var i=1;i<=5;i++) out+='<span style="color:'+(i<=Math.round(v)?'var(--gold)':'var(--surface-3)')+'">★</span>';
  return '<span style="letter-spacing:1px;font-size:12px">'+out+'</span>';
}

  openModal(r.name,h,adminOn()?'<button class="btn" data-act="awardref" data-r="'+id+'">'+esc(T("awardPts"))+'</button>':'');

/* ───────── day navigation ───────── */
function setDay(d){ dayDir=(d>(R.arg||""))?1:-1; R.arg=d; go("matches/"+d) }
function stepDay(dir){
  var days=matchDays(R.div); if(!days.length) return;
  var cur=pickDay(days,R.arg);
  var i=days.map(function(d){return d.date}).indexOf(cur)+dir;
  if(i<0||i>=days.length) return;
  dayDir=dir; R.arg=days[i].date; go("matches/"+days[i].date);
}
function stepAdmDay(dir){
  var days=matchDays(R.div); if(!days.length) return;
  var cur=pickDay(days,admDay);
  var i=days.map(function(d){return d.date}).indexOf(cur)+dir;
  if(i<0||i>=days.length) return;
  dayDir=dir; admDay=days[i].date; render();
}
var railReady=false;
function centreDay(smooth){
  var c=document.querySelector('.daychip[aria-pressed="true"]');
  if(!c||!c.parentNode) return;
  var rail=c.parentNode;
  var target=c.offsetLeft-(rail.clientWidth-c.offsetWidth)/2;
  try{ rail.scrollTo({left:Math.max(0,target),behavior:smooth?"smooth":"auto"}) }
  catch(e){ rail.scrollLeft=Math.max(0,target) }
}

var lastKey="";
function render(){
  renderChrome();
  var v=$("#view"), h="";
  switch(R.page){
    case "matches": h=viewMatches(); break;
    case "table": h=viewTable(); break;
    case "stats": h=viewStats(); break;
    case "transfers": h=viewTransfers(); break;
    case "news": h=viewNews(); break;
    case "clubs": h=viewClubs(); break;
    case "club": h=viewClub(); break;
    case "player": h=viewPlayer(); break;
    case "fan": h=viewFan(); break;
    case "profile": h=viewProfile(); break;
    case "following": h=viewFollowing(); break;
    case "search": h=viewSearch(); break;
    case "arbiter": h=viewArbiter(); break;
    case "referee": h=viewReferee(); break;
    case "admin": h=viewAdmin(); break;
    case "ref": h=viewRef(); break;
    default: h=viewHome();
  }
  v.innerHTML=h;
  var key=R.page+"/"+(R.page==="matches"?"":R.arg);
  if(key!==lastKey){ lastKey=key; adPick={}; toTop(); track("view", R.page); }
  if(document.querySelector(".daterail")){ centreDay(railReady); railReady=true }
  else railReady=false;
  if(document.getElementById("gbtn")){ gLoad(); gPaint(); }
  if(document.querySelector("[data-notif]") && PUSHKEY===null) pushKeyLoad().then(function(k){ if(k) render() });
  /* A bracket is wider than a phone once the quarter finals exist, so open it on
     the round the cup has actually reached rather than on the first round. */
  (function(){
    var w=document.querySelector(".kowrap");
    if(!w || w.scrollWidth<=w.clientWidth) return;
    var live=w.querySelector(".kobox:not(.kowin):not(.koout):not(.kowait)");
    var to=live||w.querySelector(".kowait")||w.querySelector(".kochamp");
    if(!to) return;
    var x=to.offsetLeft+to.offsetWidth/2-w.clientWidth/2;
    w.scrollLeft=Math.max(0,x);
  })();
}

function applyTheme(){

}


/* shrink an uploaded advert image to a data URI the app can carry */
document.addEventListener("change",function(ev){
  var ps=ev.target.closest&&ev.target.closest("[data-pset]");
  if(ps){
    var k=ps.getAttribute("data-pset");
    if(k==="lang"){ LANG=ps.value; lsSet("kf.lang",LANG) }
    if(k==="theme"){ lsSet("kf.theme",ps.value); applyTheme() }
    render(); return;
  }
  var nb=ev.target.closest&&ev.target.closest("[data-notif]");
  if(nb){ NOTIF[nb.getAttribute("data-notif")]=!!nb.checked; notifSave(); return }
  var sel=ev.target.closest&&ev.target.closest("[data-grpsel]");
  if(sel){ if(sel.value && sel.value!=="__ko"){ curGroup[R.div]=sel.value; render() } return }
  var f=ev.target;
  if(!f||!f.getAttribute||!f.getAttribute("data-imgfor")) return;
  var key=f.getAttribute("data-imgfor"), file=f.files&&f.files[0];
  if(!file) return;
  var rd=new FileReader();
  rd.onload=function(){
    var im=new Image();
    im.onload=function(){
      var MAX=1200, w=im.width, hh=im.height;
      if(w>MAX){ hh=Math.round(hh*MAX/w); w=MAX }
      var cv=document.createElement("canvas"); cv.width=w; cv.height=hh;
      cv.getContext("2d").drawImage(im,0,0,w,hh);
      var uri;
      try{ uri=cv.toDataURL("image/webp",.82) }catch(e){ uri="" }
      if(!uri||uri.indexOf("data:image/webp")!==0) uri=cv.toDataURL("image/jpeg",.84);
      var hid=document.querySelector('[data-fk="'+key+'"]');
      if(hid) hid.value=uri;
      var pv=f.parentNode.querySelector(".imgprev");
      if(pv){ pv.hidden=false; pv.querySelector("img").src=uri }
    };
    im.src=rd.result;
  };
  rd.readAsDataURL(file);
});

document.addEventListener("click",function(ev){
  var t=ev.target;
  var adEl=t.closest&&t.closest("[data-adclick]");
  if(adEl){ track("adclick", adEl.getAttribute("data-adclick")); trkFlush(true); }
  if(t.closest&&t.closest(".brandmark")){
    var bn=Date.now(); if(bn-brandT>1600) brandTaps=0; brandT=bn; brandTaps++;
    if(brandTaps>=5){ brandTaps=0; ev.preventDefault(); closeModal(); go("admin"); return }
  }
  var bg=t.closest&&t.closest("[data-closemodal]");
  if(bg && t===bg){ closeModal(); return }
  var a=t.closest&&t.closest("[data-go],[data-godiv],[data-setcomp],[data-setdiv],[data-day],[data-daynav],[data-admday],[data-admdaynav],[data-tmode],[data-trf],[data-admclub],[data-grp],[data-match],[data-act],[data-lang]");
  if(!a) return;
  var g=a.getAttribute("data-go");
  if(g){ closeModal(); go(g); return }
  if(a.hasAttribute("data-setcomp")){ allComps=false; lsSet("kf.allcomps",false); setComp(a.getAttribute("data-setcomp")); return }
  if(a.hasAttribute("data-godiv")){ R.div=a.getAttribute("data-godiv"); render(); return }
  if(a.hasAttribute("data-mfilt")){ mFilter=a.getAttribute("data-mfilt"); render(); return }
  if(a.hasAttribute("data-compfold")){
    var cf=a.getAttribute("data-compfold");
    if(compShut[cf]) delete compShut[cf]; else compShut[cf]=1;
    render(); return;
  }
  if(a.hasAttribute("data-alldiv")){
    allComps=true; lsSet("kf.allcomps",true); if(R.page==="matches")R.arg=""; render(); return;
  }
  if(a.hasAttribute("data-setdiv")){ R.div=a.getAttribute("data-setdiv"); if(R.page==="matches")R.arg=""; render(); return }
  if(a.hasAttribute("data-day")){ setDay(a.getAttribute("data-day")); return }
  if(a.hasAttribute("data-daynav")){ stepDay(+a.getAttribute("data-daynav")); return }
  if(a.hasAttribute("data-admday")){ admDay=a.getAttribute("data-admday"); dayDir=1; render(); return }
  if(a.hasAttribute("data-admdaynav")){ stepAdmDay(+a.getAttribute("data-admdaynav")); return }
  if(a.hasAttribute("data-grp")){ curGroup[R.div]=a.getAttribute("data-grp"); render(); return }
  if(a.hasAttribute("data-tmode")){ tableMode=a.getAttribute("data-tmode"); render(); return }
  if(a.hasAttribute("data-trf")){ trFilter=a.getAttribute("data-trf"); render(); return }
  if(a.hasAttribute("data-admclub")){ admClub=a.getAttribute("data-admclub"); render(); return }
  if(a.hasAttribute("data-lang")){ LANG=a.getAttribute("data-lang"); lsSet("kf.lang",LANG); closeModal(); render(); return }
  if(a.hasAttribute("data-match")){ openMatch(a.getAttribute("data-match")); return }
  var act=a.getAttribute("data-act");
  switch(act){
    case "unlock": {
      var pe=$("#admpin"); if(!pe) break;
      if(admUnlock(pe.value.trim())){ toast(T("unlocked")); render() } else { toast(T("wrongCode")); pe.value=""; pe.focus() }
      break;
    }
    case "lock": admLock(); toast(T("locked")); go("home"); break;
    case "setpin": {
      var ne=$("#newpin"); if(!ne) break;
      var nv=ne.value.trim();
      if(nv.length<4){ toast(T("codeShort")); break }
      DATA.adminpin=admHash(nv); lsSet("kf.adm",DATA.adminpin); mark(); toast(T("codeSaved")); render(); break;
    }
    case "ourtable": {
      var od=a.getAttribute("data-d");
      DATA.ourtables=DATA.ourtables||{};
      DATA.ourtables[od]=!DATA.ourtables[od];
      mark(); render(); break;
    }
    case "ovdays": OVDAYS=+a.getAttribute("data-d")||30; OV=null; render(); break;
    case "ovreload": OV=null; render(); break;
    case "srvnewref": {
      openForm(LANG==="pa"?"Arbiter nobo":"New referee",[
        {k:"name",label:LANG==="pa"?"Nòmber":"Name"},
        {k:"ffkName",label:LANG==="pa"?"Nòmber manera FFK ta skirbi'l":"Name exactly as FFK spells it",
         hint:LANG==="pa"?"Mester ta identiko na e formulario di FFK":"Must match the FFK match sheet exactly"},
        {k:"area",label:LANG==="pa"?"Bario":"District"},
        {k:"role",label:"Role",type:"select",options:[["ref",LANG==="pa"?"Arbiter":"Referee"],["admin","Admin"]]}
      ],{name:"",ffkName:"",area:"",role:"ref"},function(v){
        if(!v.name){ toast(LANG==="pa"?"Falta nòmber":"Name required"); return }
        api("/admin/referees",{method:"POST",auth:true,body:v}).then(function(j){
          ADMREFS=null; BOARD=null;
          openModal(LANG==="pa"?"Kódigo di "+v.name:"Code for "+v.name,
            '<p>'+esc(LANG==="pa"?"Duna e arbiter aki e kódigo aki. E ta sirbi un biaha so."
                                 :"Give the referee this code. It works once.")+'</p>'+
            '<div class="card" style="padding:16px;text-align:center;font-family:ui-monospace,monospace;font-size:24px;letter-spacing:2px">'+
              esc(j.invite)+'</div>');
          render();
        }).catch(function(e){ toast(e.message) });
      },null);
      break;
    }
    case "fixscore": {
      var fm=a.getAttribute("data-m");
      var fh=$("#fixhs"), fa=$("#fixas");
      if(!fh||!fa) break;
      api("/admin/score",{method:"POST",auth:true,body:{matchId:fm,hs:+fh.value,as:+fa.value}})
        .then(function(r){
          refApply(fm,{status:"ft",confirmed:true,hs:r.hs,as:r.as});
          OURRES=null; loadResults(); LB=null; BOARD=null; MYPTS=null;
          toast(T("saved")); render();
        }).catch(function(e){ toast(e.message) });
      break;
    }
    case "srvactive": {
      var aid=a.getAttribute("data-r"), aon=a.getAttribute("data-on")==="1";
      api("/admin/referees/active",{method:"POST",auth:true,body:{id:aid,active:aon}})
        .then(function(){ ADMREFS=null; BOARD=null; toast(T("saved")); render() })
        .catch(function(e){ toast(e.message) });
      break;
    }
    case "srvdelref": {
      var did=a.getAttribute("data-r"), dnm=a.getAttribute("data-n")||did;
      if(!confirm((LANG==="pa"?"Kita ":"Delete ")+dnm+"?")) break;
      api("/admin/referees/delete",{method:"POST",auth:true,body:{id:did}})
        .then(function(){ ADMREFS=null; BOARD=null; toast(T("saved")); render() })
        .catch(function(e){ toast(e.message) });
      break;
    }
    case "srvreset": {
      var rid=a.getAttribute("data-r");
      api("/admin/referees/reset",{method:"POST",auth:true,body:{id:rid}}).then(function(j){
        ADMREFS=null;
        openModal(LANG==="pa"?"Kódigo nobo":"New code",
          '<p>'+esc(LANG==="pa"?"Su kódigo bieu i su PIN a kaba di ser borá."
                               :"Their old code and PIN have just been cleared.")+'</p>'+
          '<div class="card" style="padding:16px;text-align:center;font-family:ui-monospace,monospace;font-size:24px;letter-spacing:2px">'+
            esc(j.invite)+'</div>');
        render();
      }).catch(function(e){ toast(e.message) });
      break;
    }
    case "srvaward": {
      var opts=(Array.isArray(ADMREFS)?ADMREFS:[]).map(function(r){return [r.id,r.name]});
      if(!opts.length){ toast(LANG==="pa"?"Traha un kuenta promé":"Create an account first"); break }
      openForm(T("awardPts"),[
        {k:"refId",label:LANG==="pa"?"Arbiter":"Referee",type:"select",options:opts},
        {k:"points",label:T("points")+" (+/-)",type:"number"},
        {k:"reason",label:LANG==="pa"?"Motibu":"Reason"}
      ],{refId:opts[0][0],points:40,reason:""},function(v){
        api("/admin/award",{method:"POST",auth:true,body:v}).then(function(){
          ADMREFS=null; BOARD=null; MYPTS=null; toast(T("saved")); render();
        }).catch(function(e){ toast(e.message) });
      },null);
      break;
    }
    case "fanjoin": {
      var fne=$("#fanname"); if(!fne) break;
      var fnm=fne.value.trim();
      if(fnm.length<2){ toast(LANG==="pa"?"Skohe un nòmber":"Pick a name"); break }
      api("/auth/fan",{method:"POST",body:{name:fnm}}).then(function(j){
        FANU={token:j.token,id:j.user.id,name:j.user.name,pic:"",via:"name"};
        lsSet("kf.fanacct",FANU); LB=null; prefsPulled=false; pushPreds(); prefsPull();
        toast(T("welcome")); closeModal(); render();
        if(!FAN.onboard) setTimeout(function(){ if(!FAN.clubs.length) openPicker() },500);
      }).catch(function(e){ toast(e.message) });
      break;
    }
    case "fanout":
      api("/auth/logout",{method:"POST",fan:true}).catch(function(){});
      FANU=null; lsSet("kf.fanacct",null); LB=null; prefsPulled=false; render();
      break;
    case "reflogin": {
      var idEl=$("#refid"), pinEl=$("#refpin");
      if(!idEl||!pinEl) break;
      var who=idEl.value.trim(), pin=pinEl.value.trim();
      if(!who||!pin){ toast(T("wrongCode")); break }
      var isCode=/^[A-Za-z0-9]{4}-?[A-Za-z0-9]{4}$/.test(who);
      var call=isCode
        ? api("/auth/ref/claim",{method:"POST",body:{code:who.toUpperCase(),pin:pin}})
        : api("/auth/ref/login",{method:"POST",body:{id:who,pin:pin}});
      call.then(function(j){
        REF={token:j.token,id:j.referee.id,name:j.referee.name,role:j.referee.role||"ref"};
        lsSet("kf.ref",REF); refMatches=null; refReload(); toast(T("welcome")); render();
      }).catch(function(e){ toast(e.message||T("wrongCode")) });
      break;
    }
    case "redeem": {
      var wid=a.getAttribute("data-w");
      api("/ref/redeem",{method:"POST",body:{rewardId:wid},auth:true}).then(function(r){
        MYPTS=null; REWARDS=null; MYRED=null; BOARD=null;
        toast((LANG==="pa"?"Bo kódigo: ":"Your code: ")+r.code);
        render();
      }).catch(function(e){ toast(e.message) });
      break;
    }
    case "reflogout":
      api("/auth/logout",{method:"POST",auth:true}).catch(function(){});
      REF=null; refMatches=null; refOpen=""; lsSet("kf.ref",null); refReload();
      if(R.page==="admin") { go("home") } else { render() }
      break;
    case "refopen": refOpen=a.getAttribute("data-m"); render(); break;
    case "refstart": {
      var sid=a.getAttribute("data-m");
      refSend("/ref/match/"+sid+"/start",{minute:0}).then(function(r){
        if(r&&r.queued){ refApply(sid,{status:"live",minute:0}); toast(T("queued")) }
        else refApply(sid, r.state);
        render(); pollLive();
      }).catch(function(e){ toast(e.message) });
      break;
    }
    case "notifask": notifAsk(); break;
    case "notiftest":
      if(notifState()!=="granted"){ toast(LANG==="pa"?"Sendé nan promé":"Turn them on first"); break }
      NOTIF.on=true; notifSave();
      notifShow("\u26BD 599 Scores", LANG==="pa"?"Asina un gol ta yega serka bo":"This is how a goal will reach you", "test");
      toast(LANG==="pa"?"Mandá":"Sent");
      break;
    case "refht": {
      var hid=a.getAttribute("data-m");
      refSend("/ref/match/"+hid+"/ht",{}).then(function(r){
        refApply(hid, (r&&r.state)||{status:"ht",minute:45});
        toast(LANG==="pa"?"Mitar tempo":"Half time"); render(); pollLive();
      }).catch(function(e){ toast(e.message) });
      break;
    }
    /* Second half whistle: the clock picks up at 45 and runs on its own again. */
    /* One name per line, straight off the match sheet. Faster on a phone at a
       ground than twenty two taps, and it accepts a name we have never seen. */
    case "reflineup": {
      var lm=a.getAttribute("data-m"), lt=a.getAttribute("data-team");
      var cur=(LINEUP[lm]||{})[lt]||{starters:[],subs:[]};
      if(LINEUP[lm]===undefined || LINEUP[lm]==="loading"){ lineupLoad(lm); }
      var sq=(DATA.players||[]).filter(function(x){return x.club===lt}).map(function(x){return x.name});
      openModal(club(lt).short+" · "+(LANG==="pa"?"Alineashon":"Lineup"),
        '<p class="muted" style="margin:0 0 10px;font-size:12.5px">'+esc(LANG==="pa"
          ? "Un nòmber pa kada liña, den òrdu di kamiseta."
          : "One name per line, in shirt order.")+'</p>'+
        '<div class="field"><label>'+esc(LANG==="pa"?"E once":"The eleven")+'</label>'+
          '<textarea id="lustart" rows="11" style="font-size:14px">'+esc((cur.starters||[]).join("\n"))+'</textarea></div>'+
        '<div class="field"><label>'+esc(LANG==="pa"?"Banka":"Bench")+'</label>'+
          '<textarea id="lusubs" rows="5" style="font-size:14px">'+esc((cur.subs||[]).join("\n"))+'</textarea></div>'+
        (sq.length?'<p class="muted" style="font-size:11.5px;margin:6px 0 0">'+esc(LANG==="pa"?"Den nos lista: ":"In our squad list: ")+esc(sq.slice(0,14).join(", "))+'</p>':''),
        '<button class="btn" data-act="lineupsave" data-m="'+esc(lm)+'" data-team="'+esc(lt)+'">'+esc(T("save"))+'</button>'+
        '<button class="btn ghost" data-act="closemodal">'+esc(T("cancel"))+'</button>');
      break;
    }
    case "lineupsave": {
      var sm=a.getAttribute("data-m"), st2=a.getAttribute("data-team");
      var s1=$("#lustart"), s2=$("#lusubs");
      if(!s1) break;
      refSend("/ref/match/"+sm+"/lineup",{team:st2,starters:s1.value,subs:s2?s2.value:""})
        .then(function(r){
          if(r&&r.queued){ toast(T("queued")) }
          else{
            LINEUP[sm]=LINEUP[sm]&&LINEUP[sm]!=="loading"?LINEUP[sm]:{};
            LINEUP[sm][st2]={starters:r.starters||[],subs:r.subs||[]};
            toast(T("saved"));
          }
          closeModal(); render();
        }).catch(function(e){ toast(e.message) });
      break;
    }
    case "refsecond": {
      var s2=a.getAttribute("data-m");
      refSend("/ref/match/"+s2+"/second",{}).then(function(r){
        if(r&&r.queued){ refApply(s2,{status:"live",minute:45,h2At:new Date().toISOString()}); toast(T("queued")) }
        else refApply(s2, r.state);
        toast(LANG==="pa"?"2do tempo":"Second half"); render(); pollLive();
      }).catch(function(e){ toast(e.message) });
      break;
    }
    /* One tap. No dialogs. A referee is not going to fill in a form mid match. */
    case "refgoal": {
      var mid=a.getAttribute("data-m"), team=a.getAttribute("data-team"), gmin=refGuessMinute(mid);
      refSend("/ref/match/"+mid+"/event",{type:"goal",team:team,min:gmin})
        .then(function(r){
          if(r&&r.queued){ toast(T("queued")) }
          else { refApply(mid,{status:"live",hs:r.hs,as:r.as,minute:gmin}); refEvents[mid]=null }
          toast("⚽ "+gmin+"′ "+club(team).short);
          render(); pollLive();
          /* The goal is already in. Asking who scored afterwards means the tap
             is never slowed down and nothing is lost if he never answers. */
          if(r && r.eventId) askScorer(mid, team, r.eventId, gmin);
        }).catch(function(e){ toast(e.message) });
      break;
    }
    case "scorersave": {
      var sm=a.getAttribute("data-m"), se=a.getAttribute("data-e");
      var who=$("#scname"), ast=$("#scassist");
      var nm=who?who.value.trim():"";
      if(!nm){ closeModal(); break }
      refSend("/ref/match/"+sm+"/name",{eventId:se,player:nm,assist:ast?ast.value.trim():""})
        .then(function(){ refEvents[sm]=null; toast(T("saved")); closeModal(); render(); pollLive() })
        .catch(function(e){ toast(e.message); closeModal() });
      break;
    }
    /* Curacao passes things round on WhatsApp, so this is how the app travels. */
    case "sharematch": {
      var shid=a.getAttribute("data-m");
      var sm2=DATA.matches.filter(function(x){return x.id===shid})[0];
      if(!sm2) break;
      var done=sm2.status==="ft"||sm2.status==="live";
      var line=club(sm2.home).short+(done?" "+sm2.hs+" - "+sm2.as+" ":" v ")+club(sm2.away).short;
      var url=location.origin+location.pathname+"#/m/"+shid;
      var txt=line+" · 599 Scores";
      if(navigator.share){
        navigator.share({title:"599 Scores", text:txt, url:url}).catch(function(){});
      } else if(navigator.clipboard){
        navigator.clipboard.writeText(txt+"\n"+url).then(function(){
          toast(LANG==="pa"?"Kopiá":"Copied");
        }).catch(function(){ toast(url) });
      } else toast(url);
      break;
    }
    case "refname2": {
      askScorer(a.getAttribute("data-m"), a.getAttribute("data-team"),
                a.getAttribute("data-e"), a.getAttribute("data-min"));
      break;
    }
    case "scorerpick": {
      var el=$("#scname");
      if(el){ el.value=a.getAttribute("data-name"); el.focus() }
      break;
    }
    case "refpostpone": {
      var pm=a.getAttribute("data-m"), pst=a.getAttribute("data-s");
      var word = pst==="post" ? (LANG==="pa"?"posponé":"postponed") : (LANG==="pa"?"kancelá na medio":"abandoned");
      if(!confirm((LANG==="pa"?"Marka e partido komo ":"Mark the match as ")+word+"?")) break;
      var note=prompt(LANG==="pa"?"Motibu (opshonal)":"Reason (optional)","")||"";
      refSend("/ref/match/"+pm+"/state",{status:pst,note:note})
        .then(function(r){ refApply(pm,(r&&r.state)||{status:pst,note:note}); toast(T("saved")); render(); pollLive() })
        .catch(function(e){ toast(e.message) });
      break;
    }
    case "refcard": {
      var mid2=a.getAttribute("data-m"), team2=a.getAttribute("data-team"), cmin=refGuessMinute(mid2);
      refSend("/ref/match/"+mid2+"/event",{type:"yc",team:team2,min:cmin})
        .then(function(r){
          if(r&&r.queued) toast(T("queued"));
          else { refApply(mid2,{status:"live",minute:cmin}); refEvents[mid2]=null }
          toast("🟨 "+cmin+"′ "+club(team2).short);
          render(); pollLive();
        }).catch(function(e){ toast(e.message) });
      break;
    }
    case "refundo": {
      var mid3=a.getAttribute("data-m"), eid=a.getAttribute("data-e");
      refSend("/ref/match/"+mid3+"/undo",{eventId:eid})
        .then(function(r){
          if(r&&r.queued) toast(T("queued"));
          else refApply(mid3,{hs:r.hs,as:r.as});
          refEvents[mid3]=null; render(); pollLive();
        }).catch(function(e){ toast(e.message) });
      break;
    }
    case "refminute": {
      var mid4=a.getAttribute("data-m");
      var mn4=prompt(LANG==="pa"?"Minüt aktual?":"Current minute?", String(refGuessMinute(mid4)));
      if(mn4===null) break;
      refSend("/ref/match/"+mid4+"/resume",{minute:parseInt(mn4,10)||0})
        .then(function(r){ refApply(mid4,(r&&r.state)||{minute:parseInt(mn4,10)||0,status:"live"}); render() })
        .catch(function(e){ toast(e.message) });
      break;
    }
    case "refconfirm": {
      var mid5=a.getAttribute("data-m");
      if(!confirm(LANG==="pa"?"Konfirmá e resultado final? Despues bo no por kambia.":"Confirm the final score? You cannot change it afterwards.")) break;
      refSend("/ref/match/"+mid5+"/confirm",{})
        .then(function(r){
          if(r&&r.queued) toast(T("queued"));
          else { refApply(mid5,{status:"ft",confirmed:true,hs:r.hs,as:r.as}); OURRES=null; loadResults(); }
          toast(T("saved")); render(); pollLive();
        }).catch(function(e){ toast(e.message) });
      break;
    }
    case "saverates": {
      var R2=DATA.refrules=DATA.refrules||{div:{},role:{},levels:[]};
      R2.div=R2.div||{};
      Array.prototype.forEach.call(document.querySelectorAll("[data-rate]"),function(e){
        var k=e.getAttribute("data-rate"), v=parseInt(e.value,10);
        if(!isFinite(v)) return;
        if(k==="_live") R2.liveBonus=v; else R2.div[k]=v;
      });
      mark(); toast(T("saved")); render(); break;
    }
    case "redmark": {
      api("/admin/redemptions",{method:"POST",auth:true,
        body:{id:a.getAttribute("data-i"),status:a.getAttribute("data-s")}})
        .then(function(){ REDS=null; BOARD=null; toast(T("saved")); render() })
        .catch(function(e){ toast(e.message) });
      break;
    }
    case "newad": editAd(""); break;
    case "editad": editAd(a.getAttribute("data-a")); break;
    case "clrimg": {
      var hk=a.getAttribute("data-k"), hid=document.querySelector('[data-fk="'+hk+'"]');
      if(hid) hid.value="";
      var pv=a.parentNode.querySelector(".imgprev"); if(pv) pv.hidden=true;
      a.remove(); break;
    }
    case "saveads": {
      var g=function(k){var e=document.querySelector('[data-setting="'+k+'"]');return e?e.value:""};
      DATA.adsettings={house:!!g("ads_house"),pa:g("ads_pa"),en:g("ads_en"),link:g("ads_link")};
      adPick={}; mark(); toast(T("saved")); render(); break;
    }
    case "closemodal": closeModal(); break;
    case "votepotm": {
      var s=$("#potmsel"); if(!s) break;
      FAN.potm=FAN.potm||{}; FAN.potm[a.getAttribute("data-m")]=s.value; saveFan();
      toast(T("voted")); break;
    }
    case "resetfan": FAN={club:"",clubs:[],players:[],primary:"",onboard:true,potm:{},preds:{}}; saveFan(); render(); break;
    case "favc": toggleClub(a.getAttribute("data-id")); if(document.querySelector(".pickgrid")) openPicker(); else render(); break;
    case "favp": togglePlayer(a.getAttribute("data-id")); render(); break;
    case "setprim": FAN.primary=a.getAttribute("data-id"); if(!follows(FAN.primary))FAN.clubs.push(FAN.primary); saveFan(); render(); break;
    case "favm": toggleMatch(a.getAttribute("data-id")); render(); break;
    case "backupsrv": {
      toast(LANG==="pa"?"Ta prepará...":"Preparing...");
      api("/admin/export",{auth:true}).then(function(j){
        var name="599-scores-backup-"+today()+".json";
        dl(name, JSON.stringify(j));
        var n=Object.keys(j.counts||{}).map(function(k){return k+" "+j.counts[k]}).join(", ");
        toast((LANG==="pa"?"Bahá: ":"Saved: ")+name);
        console.log("[599] backup", n);
      }).catch(function(e){ toast(e.message) });
      break;
    }
    case "adreport": {
      var ridEl=$("#adrid"), rdEl=$("#adrdays");
      if(!ridEl) break;
      var rid=ridEl.value, rdays=rdEl?rdEl.value:"30";
      var adName=((DATA.ads||[]).filter(function(x){return x.id===rid})[0]||{}).name||rid;
      api("/admin/adreport?id="+encodeURIComponent(rid)+"&days="+encodeURIComponent(rdays),{auth:true})
        .then(function(j){
          var lines=[];
          lines.push("599 Scores  -  "+(LANG==="pa"?"rapòrt di publisidat":"advertising report"));
          lines.push(adName);
          lines.push((LANG==="pa"?"Periodo":"Period")+": "+j.from+" .. "+j.to);
          lines.push("");
          lines.push((LANG==="pa"?"Biaha mustrá":"Impressions")+": "+j.views);
          lines.push((LANG==="pa"?"Klek":"Clicks")+": "+j.clicks);
          lines.push("CTR: "+j.ctr+"%");
          lines.push((LANG==="pa"?"Telefon diferente den e periodo":"Different phones in the period")+": "+j.reach);
          lines.push("");
          lines.push((LANG==="pa"?"Dia":"Day")+",  "+(LANG==="pa"?"mustrá":"impressions")+",  "+(LANG==="pa"?"klek":"clicks"));
          (j.rows||[]).forEach(function(r){ lines.push(r.day+",  "+r.views+",  "+r.clicks) });
          dl("599-scores-"+String(adName).replace(/[^A-Za-z0-9]+/g,"-").toLowerCase()+"-"+today()+".csv",
             lines.join("\n"));
          toast(LANG==="pa"?"Bahá":"Saved");
        }).catch(function(e){ toast(e.message) });
      break;
    }
    /* A fixture for a day the federation has not published yet. Any competition,
       any date, and it survives every refresh until they publish it themselves. */
    case "a2hs": {
      if(INSTALLQ){
        try{ INSTALLQ.prompt() }catch(e){}
        INSTALLQ=null; lsSet("kf.a2hs",1); render();
      }
      break;
    }
    case "a2hsno": { lsSet("kf.a2hs",1); render(); break }
    case "ownmatch": {
      var dvs=DATA.divisions;
      var cls=DATA.clubs.slice().sort(function(a,b){return String(a.short).localeCompare(String(b.short))});
      var opts=function(sel){ return cls.map(function(c){
        return '<option value="'+esc(c.id)+'"'+(sel===c.id?' selected':'')+'>'+esc(c.short)+'</option>' }).join("") };
      openModal(LANG==="pa"?"Partido nobo":"New fixture",
        '<div class="field"><label>'+esc(LANG==="pa"?"Kompetishon":"Competition")+'</label><select id="omdiv">'+
          dvs.map(function(d){ return '<option value="'+esc(d.id)+'"'+(d.id===R.div?' selected':'')+'>'+esc(d.short)+' '+esc(d.season)+'</option>' }).join("")+'</select></div>'+
        '<div class="frow"><div class="field"><label>'+esc(T("date"))+'</label><input id="omdate" type="date" value="'+esc(admDay||today())+'"></div>'+
        '<div class="field"><label>'+esc(LANG==="pa"?"Ora":"Time")+'</label><input id="omtime" type="time" value="19:00"></div></div>'+
        '<div class="field"><label>'+esc(LANG==="pa"?"Kas":"Home")+'</label><select id="omhome">'+opts("")+'</select></div>'+
        '<div class="field"><label>'+esc(LANG==="pa"?"Bishita":"Away")+'</label><select id="omaway">'+opts("")+'</select></div>'+
        '<div class="field"><label>'+esc(T("venue"))+'</label><input id="omvenue" placeholder="'+esc(LANG==="pa"?"Kancha":"Ground")+'"></div>'+
        '<div class="field"><label>'+esc(T("referee"))+'</label><input id="omref" placeholder="'+esc(LANG==="pa"?"Nòmber manera FFK ta skirbi e":"Name exactly as FFK spells it")+'"></div>'+
        '<p class="muted" style="font-size:12px;margin:6px 0 0">'+esc(LANG==="pa"
          ? "Ora FFK publiká e mesun partido, esun di bo ta kita su mes, sin duplika."
          : "When FFK publishes the same fixture, yours steps aside on its own, with no duplicate.")+'</p>',
        '<button class="btn" data-act="ownsave">'+esc(T("save"))+'</button>'+
        '<button class="btn ghost" data-act="closemodal">'+esc(T("cancel"))+'</button>');
      break;
    }
    case "ownsave": {
      var od=$("#omdiv"), odt=$("#omdate"), oti=$("#omtime"), oh=$("#omhome"), oa=$("#omaway");
      if(!od||!odt||!oh||!oa) break;
      if(oh.value===oa.value){ toast(LANG==="pa"?"Dos klub diferente":"Two different clubs"); break }
      if(!/^\d{4}-\d{2}-\d{2}$/.test(odt.value)){ toast(LANG==="pa"?"Skohe un fecha":"Pick a date"); break }
      DATA.ownmatches=DATA.ownmatches||[];
      var nid="x"+Date.now().toString(36)+Math.floor(Math.random()*900+100);
      DATA.ownmatches.push({
        id:nid, div:od.value, date:odt.value, time:(oti&&oti.value)||"19:00",
        home:oh.value, away:oa.value,
        venue:($("#omvenue")&&$("#omvenue").value.trim())||"",
        ref:($("#omref")&&$("#omref").value.trim())||""
      });
      mark(); admDay=odt.value; closeModal();
      toast(LANG==="pa"?"Partido pone. No lubidá Publiká.":"Fixture added. Remember to Publish.");
      render();
      break;
    }
    case "delown": {
      var oid=a.getAttribute("data-id");
      DATA.ownmatches=(DATA.ownmatches||[]).filter(function(x){return x.id!==oid});
      DATA.matches=DATA.matches.filter(function(x){return x.id!==oid});
      mark(); render();
      break;
    }
    case "newseason": {
      var fromEl=$("#nsfrom"), yrEl=$("#nsyear");
      if(!fromEl||!yrEl) break;
      var src=DV[fromEl.value], yr=String(yrEl.value||"").trim();
      if(!src||!/^\d{4}$/.test(yr)){ toast(LANG==="pa"?"Skohe un aña di 4 sifra":"Pick a four digit year"); break }
      var base=String(src.id).replace(/\d{4}$/,"");
      var nid=base+yr;
      if(DV[nid]){ toast(LANG==="pa"?"E temporada ei ta eksistí kaba":"That season already exists"); break }
      var roster=rosterOf(src.id);
      if(!roster.length){ toast(LANG==="pa"?"E kompetishon ei no tin klub":"That competition has no clubs"); break }
      DATA.newseasons=DATA.newseasons||[];
      DATA.newseasons.push({
        id:nid, name:String(src.name||"").replace(/\d{4}(\s*-\s*\d{2,4})?/,"").trim()+" "+yr,
        short:src.short, en:src.en||src.name, type:src.type, season:yr, status:"live",
        tier:src.tier||0, cfu:src.cfu||0, groups:[], clubs:roster
      });
      mark(); toast(LANG==="pa"?"Temporada habrí":"Season opened"); render();
      break;
    }
    case "delseason": {
      var dsid=a.getAttribute("data-id");
      DATA.newseasons=(DATA.newseasons||[]).filter(function(x){return x.id!==dsid});
      DATA.divisions=DATA.divisions.filter(function(d){return d.id!==dsid});
      if(R.div===dsid) R.div=DATA.divisions[0].id;
      mark(); render();
      break;
    }
    case "skipacct": closeModal(); setTimeout(openPicker,220); break;
    case "openpicker": openPicker(); break;
    case "pickerskip": FAN.onboard=true; saveFan(); closeModal(); render(); break;
    case "pickerdone": {
      var ps=$("#primsel"); if(ps&&ps.value) FAN.primary=ps.value;
      FAN.onboard=true; saveFan(); closeModal(); render(); break;
    }
    case "openref": openRef(a.getAttribute("data-r")); break;
    case "awardref": awardPoints(a.getAttribute("data-r")); break;
    case "formsave": {
      if(formCtx&&formCtx.onSave){ formCtx.onSave(readForm()) }
      closeModal(); render(); break;
    }
    case "formdel": {
      if(formCtx&&formCtx.onDelete){ formCtx.onDelete() }
      closeModal(); render(); break;
    }
    case "newclub": editClub(""); break;
    case "editclub": editClub(a.getAttribute("data-c")); break;
    case "newplayer": editPlayer(""); break;
    case "editplayer": editPlayer(a.getAttribute("data-p")); break;
    case "newtransfer": editTransfer(""); break;
    case "edittransfer": editTransfer(a.getAttribute("data-t")); break;
    case "newnews": editNews(""); break;
    case "newref": editReferee(""); break;
    case "editref": editReferee(a.getAttribute("data-r")); break;
    case "newledger": editLedgerEntry(""); break;
    case "editledger": editLedgerEntry(a.getAttribute("data-l")); break;
    case "newreward": editReward(""); break;
    case "editreward": editReward(a.getAttribute("data-w")); break;
    case "newsponsor": editSponsor(""); break;
    case "editsponsor": editSponsor(a.getAttribute("data-s")); break;
    case "editrules": editRules(); break;
    case "editnews": editNews(a.getAttribute("data-n")); break;
    case "newmatch": editMatch(""); break;
    case "editmatch": editMatch(a.getAttribute("data-m")); break;
    case "savematch": saveMatchForm(a.getAttribute("data-m")); closeModal(); render(); break;
    case "delmatch": {
      var mid=a.getAttribute("data-m");
      DATA.matches=DATA.matches.filter(function(x){return x.id!==mid}); mark(); closeModal(); render(); break;
    }
    case "addev": {
      var m2=DATA.matches.filter(function(x){return x.id===a.getAttribute("data-m")})[0]; if(!m2) break;
      var d={}; Array.prototype.forEach.call(document.querySelectorAll("[data-ek]"),function(e){d[e.getAttribute("data-ek")]=e.value});
      if(!d.p||!d.min){ toast(LANG==="pa"?"Skohe hungadó i minüt":"Pick a player and a minute"); break }
      var pl=P[d.p]; var team=pl?pl.club:m2.home;
      if(d.t==="og") team=(team===m2.home)?m2.away:m2.home;
      m2.events=m2.events||[];
      m2.events.push({t:d.t,min:+d.min,p:d.p,a:(d.t==="goal"||d.t==="pen")?(d.a||""):"",team:team});
      var hs=0,as=0;
      m2.events.forEach(function(e){ if(e.t==="goal"||e.t==="pen"||e.t==="og"){ if(e.team===m2.home)hs++; else as++ } });
      m2.hs=hs; m2.as=as; m2.sample=false;
      mark(); renderMatchEditor(m2.id); break;
    }
    case "delev": {
      var m3=DATA.matches.filter(function(x){return x.id===a.getAttribute("data-m")})[0]; if(!m3) break;
      m3.events.splice(+a.getAttribute("data-i"),1);
      var h2=0,a2=0;
      m3.events.forEach(function(e){ if(e.t==="goal"||e.t==="pen"||e.t==="og"){ if(e.team===m3.home)h2++; else a2++ } });
      m3.hs=h2; m3.as=a2;
      mark(); renderMatchEditor(m3.id); break;
    }
    case "savesettings": {
      Array.prototype.forEach.call(document.querySelectorAll("[data-setting]"),function(e){ DATA[e.getAttribute("data-setting")]=e.value });
      mark(); render(); toast(T("saved")); break;
    }
    case "clearsample": {
      DATA.players=DATA.players.filter(function(p){return !p.sample});
      DATA.matches=DATA.matches.filter(function(m){return !m.sample});
      DATA.transfers=DATA.transfers.filter(function(t2){return !t2.sample});
      DATA.news=DATA.news.filter(function(n){return !n.sample});
      DATA.referees=DATA.referees.filter(function(r){return !r.sample});
      DATA.refledger=(DATA.refledger||[]).filter(function(l){return !l.sample});
      DATA.rewards=DATA.rewards.filter(function(w){return !w.sample});
      DATA.demo=false; mark(); render(); toast(T("saved")); break;
    }
    case "export": {
      var json=JSON.stringify(DATA,null,1);
      if(dl("599-scores-"+today()+".json",json,"application/json")){ /* saved */ }
      else {
        openModal("Backup JSON",'<textarea style="width:100%;min-height:320px;font-family:ui-monospace,monospace;font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px">'+esc(json)+'</textarea>');
      }
      break;
    }
    case "import": {
      openModal(T("importJSON"),'<div class="field"><label>JSON</label><textarea id="impbox" style="min-height:240px;font-family:ui-monospace,monospace;font-size:11px"></textarea></div>',
        '<button class="btn" data-act="doimport">'+esc(T("save"))+'</button><button class="btn ghost" data-act="closemodal">'+esc(T("cancel"))+'</button>');
      break;
    }
    case "doimport": {
      try{
        var obj=JSON.parse($("#impbox").value);
        if(!obj.clubs||!obj.matches) throw new Error("shape");
        DATA=obj; mark(); closeModal(); render(); toast(T("saved"));
      }catch(e){ toast(LANG==="pa"?"JSON inválido":"Invalid JSON") }
      break;
    }
    case "publish": doPublish(a); break;
  }
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.hasAttribute&&t.hasAttribute("data-setseason")){
    var sk=t.getAttribute("data-setseason"), sd=bestOf(phasesOf(sk,t.value));
    if(sd){ R.div=sd.id; if(R.page==="matches") R.arg=""; render() }

  if(t.id==="myclub"){ FAN.club=t.value; saveFan(); render(); }
  if(t.classList&&t.classList.contains("predin")){
    var mid=t.getAttribute("data-pm"), side=t.getAttribute("data-side");
    FAN.preds=FAN.preds||{}; FAN.preds[mid]=FAN.preds[mid]||{h:"",a:""};

      api("/predictions",{method:"POST",fan:true,body:{matchId:mid,home:+pv.h,away:+pv.a}})
        .catch(function(){});

});

/* swipe between days */
var swX=0,swY=0,swOn=false;
document.addEventListener("touchstart",function(e){
  var p=e.target.closest&&e.target.closest("#daypanel");
  if(!p||e.touches.length!==1){ swOn=false; return }
  swX=e.touches[0].clientX; swY=e.touches[0].clientY; swOn=true;
},{passive:true});
document.addEventListener("touchend",function(e){
  if(!swOn) return; swOn=false;
  var dx=e.changedTouches[0].clientX-swX, dy=e.changedTouches[0].clientY-swY;
  if(Math.abs(dx)>56 && Math.abs(dx)>Math.abs(dy)*1.5) stepDay(dx<0?1:-1);
},{passive:true});
document.addEventListener("keydown",function(e){
  if(R.page!=="matches"||document.querySelector(".modal")) return;
  var tg=(e.target.tagName||"").toUpperCase();
  if(tg==="INPUT"||tg==="SELECT"||tg==="TEXTAREA") return;
  if(e.key==="ArrowRight"){ e.preventDefault(); stepDay(1) }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); stepDay(-1) }
});

/* Pull the freshest FFK data if the updater has written one next to this file.
   Your own content (transfers, news, referee rewards) is never overwritten. */
/* Keys a fresh data.json must not wipe. The FFK file knows nothing about
   adverts, reward rates or the server address, so whatever we already hold wins
   when the incoming file has nothing to say about them. Without this an advert
   disappears the moment the fixture file refreshes, and only comes back if the
   /content fetch succeeds. */
/* MINE is declared at the top, next to BAKED. */
function applyRemote(remote){
  if(!remote||!remote.clubs||!remote.divisions) return false;
  var have=lsGet("kf.data",null)||DATA;
  if(have.updated && remote.updated && remote.updated < have.updated && !have.fromRemote) return false;
  var next=JSON.parse(JSON.stringify(remote));
  MINE.forEach(function(k){ if(have[k]&&(!next[k]||!next[k].length)) next[k]=have[k] });
  MINE.forEach(function(k){
    var v=next[k];
    if(BAKED[k]!==undefined && (v===undefined || (Array.isArray(v) && !v.length))) next[k]=BAKED[k];
  });
  /* Whatever the server said we published wins over the fixture file, whichever
     of the two landed first. */
  if(LASTC) OWNKEYS.forEach(function(k){ if(LASTC[k]!==undefined) next[k]=LASTC[k] });
  next.fromRemote=true;
  stampFFK(next);
  DATA=next; reindex(); lsSet("kf.data",DATA);
  /* A fresh data.json is the pre match picture. Put our own scores and the live
     overlay back on top of it, or a refresh mid game wipes the score off the
     screen and a result the referee sent in disappears until the next reload. */
  applyOurResults();
  var keep=[];
  for(var k in LIVE.byId) keep.push(LIVE.byId[k]);
  if(keep.length) applyLive({ matches: keep });
  return true;
}
(function(){
  try{
    fetch("./data.json",{cache:"no-store"})
      .then(function(r){ return r.ok?r.json():null })
      .then(function(j){ if(applyRemote(j)){ dirty=false; render(); } })
      .catch(function(){});
  }catch(e){}
})();

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){ navigator.serviceWorker.register("./sw.js").catch(function(){}) });
}
